schema_version: "1.0"

preset:
  id: "delta-global"
  name: "Delta-Global Platform (CrowdSignal)"
  version: "2.0.0"
  description: "The kit specialised for the Delta-Global platform as it actually is: Bun + Turborepo, Next.js 16 + next-intl, Hono + Apollo GraphQL with field-level auth directives, Drizzle + Postgres/pgvector with expand-only migrations, Redis, Temporal with Python/TS workers, Stripe billing, DB-backed global feature flags, OTel → ClickHouse → Grafana, Infisical, ArgoCD pins in platform-infra. Every rule it encodes is listed in CONVENTIONS.md."
  author: "satcom"
  repository: "https://github.com/Satcomx00-x00/speckit-nextjs-SaaS"
  license: "MIT"

requires:
  speckit_version: ">=0.6.0"

# Resolved at install time into the installed copy. Override per project in
# .specify/preset-variables.yml (scoped under this preset's id or flat).
variables:
  package_scope:
    default: "@delta-global"
    description: "Workspace package scope used in imports"
  tenancy_model:
    default: "owner-scoped"
    description: "Default tenancy model a plan starts from: owner-scoped | org-scoped (Constitution IV — the plan must declare which one)"
  tenancy_column:
    default: "ownerId"
    description: "Drizzle property of the scope key for the default model (ownerId; organizationId when org-scoped)"
  tenancy_column_snake:
    default: "owner_id"
    description: "DB column backing the scope key"
  tenant_table:
    default: "user"
    description: "Table the scope key references (BetterAuth `user`; `organization` when org-scoped)"
  locales:
    default: "en, fr, es"
    description: "next-intl locales; the first is the source catalog"
  default_locale:
    default: "en"
    description: "Source locale (apps/web/messages/<locale>.json is the source of truth)"

provides:
  templates:
    - type: "template"
      name: "spec-template"
      file: "templates/spec-template.md"
      description: "Delta-Global spec template — Status/Verified header, stories with global AC-### IDs, kill-switch strategy, manual verification, success metrics, rollback thresholds, marginal cost, plan/entitlement impact, GDPR"
      replaces: "spec-template"

    - type: "template"
      name: "plan-template"
      file: "templates/plan-template.md"
      description: "Delta-Global plan template — Stack Reference, File Map, Service Interaction Map, then the 14 numbered sections real specs use (GraphQL Operations, global flag, owner-scoped RBAC, Temporal, Complexity Justification)"
      replaces: "plan-template"

    - type: "template"
      name: "tasks-template"
      file: "templates/tasks-template.md"
      description: "Delta-Global tasks template — T### grouped by user story, tests first, one commit per phase, exact paths, AC mapping, gate battery"
      replaces: "tasks-template"

    - type: "command"
      name: "speckit.research"
      file: "commands/speckit.research.md"
      description: "Pre-spec research: ground a feature idea in what the platform already has, then research prior art, the current state of the art, stack-compatible implementation options, failure modes, compliance and cost on the web — writes a cited brief in docs/research/."

    - type: "command"
      name: "speckit.plan"
      file: "commands/speckit.plan.md"
      description: "Delta-Global planning — Drizzle schema (+RLS block), Zod contracts, GraphQL SDL with auth directives, DB functions, transport-agnostic services, global feature flag, RBAC (owner/admin/member + platform admin), id-list cache, Temporal, observability as code, Service Interaction Map, Complexity Justification."
      replaces: "speckit.plan"

    - type: "command"
      name: "speckit.tasks"
      file: "commands/speckit.tasks.md"
      description: "Delta-Global task generation — T### grouped by user story with tests first, exact file paths, AC mapping, one commit per phase, and the real CI gate battery."
      replaces: "speckit.tasks"

    - type: "command"
      name: "speckit.feature"
      file: "commands/speckit.feature.md"
      description: "End-to-end vertical slice on the real stack: Zod → Drizzle (+RLS) → DB functions → service → SDL + thin resolver → codegen → RSC read / seam write → Temporal → observability → tests first → ship checklist."
      replaces: "speckit.feature"

    - type: "command"
      name: "speckit.analyze"
      file: "commands/speckit.analyze.md"
      description: "Cross-artifact drift detector — SDL ↔ resolver ↔ service coverage, auth/audit directives, tenancy predicate, flag registry, expand-only migrations, Service Interaction Map, FR/AC ↔ T### coverage, forbidden patterns."
      replaces: "speckit.analyze"

    - type: "command"
      name: "speckit.checklist"
      file: "commands/speckit.checklist.md"
      description: "Evidence-based gate runner with presets (scope, rfc, pre-merge, security, observability, migration, release) — every PASS cites a file or command output."
      replaces: "speckit.checklist"

    - type: "command"
      name: "speckit.audit"
      file: "commands/speckit.audit.md"
      description: "Run the regex audit rule engine over the codebase and summarize findings by section and severity, mapped to the platform's own check:* gates."

    - type: "command"
      name: "speckit.audit.deep"
      file: "commands/speckit.audit.deep.md"
      description: "Layered audit: regex rules, Biome, tsc, depcruise, the check:* scripts, gitleaks, bun audit, ruff/ty, then LLM confirmation and cross-file pattern analysis."

    - type: "command"
      name: "speckit.constitution.scan"
      file: "commands/speckit.constitution.scan.md"
      description: "Scan the repo and amend .specify/memory/constitution.md (semver bump + verified Sync Impact Report) instead of overwriting it."

    - type: "command"
      name: "speckit.docs.sync"
      file: "commands/speckit.docs.sync.md"
      description: "Sync CLAUDE.md / AGENTS.md from verified repo facts, preserving the SPECKIT and turborepo managed blocks."

    - type: "command"
      name: "speckit.scaffold.route"
      file: "commands/speckit.scaffold.route.md"
      description: "Scaffold an App Router segment under [locale]/(dashboard) — page, loading, error (retry()), title, next-intl keys, server flag guard."

    - type: "command"
      name: "speckit.scaffold.dal"
      file: "commands/speckit.scaffold.dal.md"
      description: "Scaffold DB functions in packages/db with the scope predicate, column projection, id-tiebreak pagination, and @critical integration tests."

    - type: "command"
      name: "speckit.scaffold.graphql"
      file: "commands/speckit.scaffold.graphql.md"
      description: "Scaffold an SDL module with auth/audit/cost directives, a thin resolver over a service, web operations + codegen, and resolver/authz tests."

    - type: "command"
      name: "speckit.scaffold.temporal"
      file: "commands/speckit.scaffold.temporal.md"
      description: "Scaffold a deterministic Temporal workflow with activities in apps/workers (Python) or apps/crawler (TS), idempotent IDs, and a replay history."

tags:
  - "saas"
  - "nextjs"
  - "graphql"
  - "drizzle"
  - "temporal"
  - "delta-global"
