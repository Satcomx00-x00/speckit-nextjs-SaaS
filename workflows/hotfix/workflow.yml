schema_version: "1.0"

workflow:
  id: "hotfix"
  name: "Hotfix Delivery"
  version: "1.1.0"
  author: "satcom"
  description: >-
    Fast-path bug fix. Skips RFC and feature-flag ceremony. Scopes the root
    cause → implements the fix → runs quality gates → verifies → deploys
    through staging to production with mandatory prod-gate confirmation.
    Use for: regressions, security patches, data integrity fixes, broken endpoints.
    Do NOT use for: new features (use saas-feature), large schema changes (use migration-only).
    Tool commands are inputs with defaults (Bun-based defaults, all overridable).

requires:
  speckit_version: ">=0.7.2"
  integrations:
    any: ["claude", "copilot", "gemini"]

inputs:
  bug_description:
    type: string
    required: true
    prompt: "What is broken? Describe the symptom observed in production."

  root_cause:
    type: string
    required: true
    prompt: "What is the root cause? (hypothesis is fine if not yet confirmed)"

  fix_description:
    type: string
    required: true
    prompt: "What is the fix? One-sentence description of the code change."

  affected_feature:
    type: string
    required: true
    prompt: "Which feature slug is affected? (e.g. 'post-publishing', 'billing')"

  severity:
    type: string
    default: "high"
    enum: ["critical", "high", "medium"]
    prompt: "Severity: critical (data loss / security / all users down), high (major feature broken), medium (degraded UX)"

  integration:
    type: string
    default: "auto"
    prompt: "AI coding integration to use (auto, claude, copilot, gemini)"

  needs_migration:
    type: boolean
    default: false
    prompt: "Does the fix require a DB migration? (rare — use migration-only workflow if substantial)"

  rollout_strategy:
    type: string
    default: "immediate"
    enum: ["immediate", "progressive"]
    prompt: "Rollout strategy: immediate (all tenants at once) or progressive (10% → 50% → 100%)"

  api_test_dir:
    type: string
    default: "apps/api/test"
    prompt: "Directory holding API tests (feature slug appended)"

  lint_cmd:
    type: string
    default: "bun run lint"
    prompt: "Lint command"

  typecheck_cmd:
    type: string
    default: "bun run typecheck"
    prompt: "Typecheck command"

  build_cmd:
    type: string
    default: "turbo run build --filter=...[HEAD^1]"
    prompt: "Build command for affected packages"

  secretscan_cmd:
    type: string
    default: "gitleaks detect --no-banner"
    prompt: "Secret scan command"

  dep_audit_cmd:
    type: string
    default: "bun pm audit --severity high"
    prompt: "Dependency audit command"

  test_cmd:
    type: string
    default: "bun test"
    prompt: "Unit/integration test runner command (path appended)"

  migrate_generate_cmd:
    type: string
    default: "bun --filter @delta-global/db drizzle-kit generate"
    prompt: "Command that generates a migration from the schema"

  migrate_apply_cmd:
    type: string
    default: "bun --filter @delta-global/db drizzle-kit migrate"
    prompt: "Command that applies migrations locally"

steps:
  # ──────────────────────────────────────────────────────────────────
  # PHASE 0 — Scope the fix
  # ──────────────────────────────────────────────────────────────────
  - id: scope
    command: speckit.specify
    integration: "{{ inputs.integration }}"
    input:
      args: |
        Hotfix scope for: {{ inputs.affected_feature }}

        BUG: {{ inputs.bug_description }}
        ROOT CAUSE: {{ inputs.root_cause }}
        FIX: {{ inputs.fix_description }}
        SEVERITY: {{ inputs.severity }}

        Produce a concise fix scope:
        - Confirmed root cause (or hypothesis + investigation steps)
        - Exact files that need to change (no more than necessary)
        - Risk surface: what else could this change break?
        - Rollback plan: what happens if we revert this commit?
        - Test strategy: what test(s) would catch a regression here?
        - Monitoring: which dashboard panel / error-tracker signal proves the fix worked?

        Hard constraints — do NOT expand scope:
        - Fix only the reported bug; open a separate issue for anything else discovered
        - If the fix requires a schema change > adding a column with a default, stop and use migration-only workflow
        - No feature additions, no refactoring unrelated to the fix
        - No new feature flags unless the fix needs a kill switch

  - id: review-scope
    type: gate
    message: |
      Review the fix scope before writing any code.
      Confirm:
      - Root cause is understood (not just symptoms)
      - Blast radius is acceptable
      - Rollback plan is clear
      - No scope creep into unrelated changes
      Choose 'reject' if more investigation is needed.
      Severity: {{ inputs.severity }}
    options: [approve, reject]
    on_reject: abort

  # ──────────────────────────────────────────────────────────────────
  # PHASE 1 — Branch
  # ──────────────────────────────────────────────────────────────────
  - id: branch
    type: shell
    run: "git checkout main && git pull && git checkout -b fix/{{ inputs.affected_feature }}-hotfix"

  # ──────────────────────────────────────────────────────────────────
  # PHASE 2 — DB migration (conditional, rare)
  # ──────────────────────────────────────────────────────────────────
  - id: migration
    type: if
    condition: "{{ inputs.needs_migration == true }}"
    then:
      - id: schema-fix
        command: speckit.tasks
        integration: "{{ inputs.integration }}"
        input:
          args: |
            Implement the minimal DB schema change required to fix:
            {{ inputs.bug_description }}

            Rules:
            - Primary keys per project convention on any new table
            - Tenant-key FK + index on any new tenant-scoped table
            - Timestamps with timezone
            - Generated migrations only — no handwritten SQL
            - Forward-compatible: no NOT NULL on existing column without default
            - No DROP without a documented expand-contract plan

      - id: migration-generate
        type: shell
        run: "{{ inputs.migrate_generate_cmd }}"

      - id: review-migration-sql
        type: gate
        message: |
          Review the generated SQL migration line by line.
          - No NOT NULL on existing table without a default
          - No DROP without an expand-contract plan (add → backfill → switch → drop)
          - CREATE INDEX CONCURRENTLY if table > 100k rows
          - Minimal change — only what is required for the fix
          If this migration is substantial, reject and use the migration-only workflow instead.
        options: [approve, reject]
        on_reject: abort

      - id: migration-apply-local
        type: shell
        run: "{{ inputs.migrate_apply_cmd }}"

  # ──────────────────────────────────────────────────────────────────
  # PHASE 3 — Implement the fix
  # ──────────────────────────────────────────────────────────────────
  - id: fix
    command: speckit.tasks
    integration: "{{ inputs.integration }}"
    input:
      args: |
        Implement the hotfix for "{{ inputs.affected_feature }}":

        BUG: {{ inputs.bug_description }}
        ROOT CAUSE: {{ inputs.root_cause }}
        FIX: {{ inputs.fix_description }}

        Hard constraints (violations abort the fix):
        - Touch ONLY the files identified in the scope
        - No raw SQL — generated migrations only
        - No analytics-store imports in app code
        - Tenant key must remain on every tenant query (do not remove tenant scoping)
        - Secrets via the project's secret manager — never bare env access
        - No relative cross-workspace imports
        - No z.any / z.unknown / z.record(z.any) in validation schemas
        - If the fix changes an API endpoint: keep the tenant-scoped entry point
          and input/output schemas from the shared package
        - If the fix changes a DAL function: keep import "server-only" + tenant scoping
        - Do not remove or bypass the feature flag guard (if one exists for this feature)

  # ──────────────────────────────────────────────────────────────────
  # PHASE 4 — Regression tests
  # ──────────────────────────────────────────────────────────────────
  - id: regression-tests
    command: speckit.tasks
    integration: "{{ inputs.integration }}"
    input:
      args: |
        Write a regression test that would catch the bug described below if it were re-introduced:

        BUG: {{ inputs.bug_description }}
        FIX: {{ inputs.fix_description }}
        AFFECTED FEATURE: {{ inputs.affected_feature }}

        Rules:
        - Use the project's test runner for unit/integration tests
        - Use the project's E2E tool only if the bug was UI-visible
        - The test must FAIL on the unfixed code and PASS on the fixed code
        - For DAL/endpoint bugs: use a real database — no mocks
        - For tenant-isolation bugs: add to isolation.spec.ts tagged @critical
        - Keep the test minimal — test exactly the regression, nothing more
        - Place in {{ inputs.api_test_dir }}/{{ inputs.affected_feature }}/
          (or the web e2e directory if UI-visible)

  - id: run-regression-tests
    type: shell
    run: "{{ inputs.test_cmd }} {{ inputs.api_test_dir }}/{{ inputs.affected_feature }}/"

  # ──────────────────────────────────────────────────────────────────
  # PHASE 5 — Quality gates
  # ──────────────────────────────────────────────────────────────────
  - id: quality-lint
    type: shell
    run: "{{ inputs.lint_cmd }}"

  - id: quality-typecheck
    type: shell
    run: "{{ inputs.typecheck_cmd }}"

  - id: quality-build
    type: shell
    run: "{{ inputs.build_cmd }}"

  - id: quality-secretscan
    type: shell
    run: "{{ inputs.secretscan_cmd }}"

  - id: quality-dep-audit
    type: shell
    run: "{{ inputs.dep_audit_cmd }}"

  # ──────────────────────────────────────────────────────────────────
  # PHASE 6 — Verify + self-review
  # ──────────────────────────────────────────────────────────────────
  - id: verify
    command: speckit.verify
    integration: "{{ inputs.integration }}"
    input:
      args: |
        Verify the hotfix for "{{ inputs.affected_feature }}" with evidence:
        - Reproduce the original bug scenario against the fixed code — confirm
          it no longer occurs (probe, not code-reading)
        - Confirm the regression test fails on unfixed code (git stash / revert
          probe if feasible, else UNVERIFIABLE with reason)
        - Run the regression test and record the result
        - Confirm no monitoring signal named in the scope is left unwired
        Write verify-report.md in the hotfix's spec directory.

  - id: self-review
    command: speckit.analyze
    integration: "{{ inputs.integration }}"
    input:
      args: |
        Hotfix self-review for "{{ inputs.affected_feature }}":

        Review the diff for:
        - Fix does not introduce new tenant-isolation violations (tenant key missing from queries)
        - No analytics-store imports added in app code
        - No raw SQL added
        - No sensitive fields added to DTO schemas
        - No z.any / z.unknown / z.record(z.any) added
        - No relative cross-workspace imports added
        - No console.log / debugger left in
        - Regression test is present and tests exactly the described bug
        - Diff is minimal — no unrelated changes included

  # ──────────────────────────────────────────────────────────────────
  # PHASE 7 — PR
  # ──────────────────────────────────────────────────────────────────
  - id: pr-description
    type: prompt
    integration: "{{ inputs.integration }}"
    prompt: |
      Generate the PR description for hotfix "{{ inputs.affected_feature }}":

      BUG: {{ inputs.bug_description }}
      ROOT CAUSE: {{ inputs.root_cause }}
      FIX: {{ inputs.fix_description }}
      SEVERITY: {{ inputs.severity }}

      Include:
      - Conventional Commit title: fix({{ inputs.affected_feature }}): <short description>
      - Root cause analysis (1 paragraph)
      - What changed (files + reason)
      - Regression test added (file path + what it asserts)
      - Rollback plan (revert commit SHA — behavior reverts immediately)
      - Risk assessment (what else could this affect?)
      - Link to the error-tracker issue or dashboard panel that shows the bug

  - id: ready-for-review
    type: gate
    message: |
      Quality gates green, verify-report written. Open the PR.
      Severity: {{ inputs.severity }}
      Required approvers:
        - critical → 2 approvers (one must be tech lead)
        - high     → 1 approver
        - medium   → 1 approver
      Do not merge until CI is green including regression test.
    options: [approve, reject]
    on_reject: abort
    check: "find specs -type d -name '*{{ inputs.affected_feature }}*' | grep -q ."

  # ──────────────────────────────────────────────────────────────────
  # PHASE 8 — Deploy to staging
  # ──────────────────────────────────────────────────────────────────
  - id: deploy-staging
    type: prompt
    integration: "{{ inputs.integration }}"
    prompt: >-
      Deploy the fix to staging via the project's deploy process. If
      needs_migration is true, confirm the migration ran before the app
      served traffic.

  - id: verify-staging
    type: gate
    message: |
      Verify the fix on staging:
      - Reproduce the original bug scenario — confirm it no longer occurs
      - Regression test passes in CI
      - No new errors in the error tracker since deploy
      - Startup logs clean
      - Error rate back to baseline
    options: [verified, abort]
    on_reject: abort

  # ──────────────────────────────────────────────────────────────────
  # PHASE 9 — Production deploy
  # ──────────────────────────────────────────────────────────────────
  - id: prod-gate
    type: gate
    message: |
      Staging verified. Promotion to PRODUCTION requires manual confirmation.
      Type 'DEPLOY' to confirm. This is the last abort point.
      Severity: {{ inputs.severity }}
      Rollback: revert the merge commit — no flag toggle needed.
    options: [DEPLOY, abort]
    on_reject: abort

  - id: deploy-prod
    type: prompt
    integration: "{{ inputs.integration }}"
    prompt: >-
      Deploy the fix to production via the project's deploy process. If
      needs_migration is true, confirm the migration ran successfully before
      the app served traffic.

  - id: rollout
    type: switch
    expression: "{{ inputs.rollout_strategy }}"
    cases:

      immediate:
        - id: monitor-immediate
          type: gate
          message: |
            Fix deployed to 100% of production. Monitor for 2 hours:
            - Error tracker: zero new instances of the original error
            - Error rate at or below pre-bug baseline
            - p95 latency normal
            - No new unrelated errors introduced
          options: [stable, abort]
          on_reject: abort

      progressive:
        - id: rollout-10
          type: gate
          message: "Fix live for 10% of tenants. Observe 30 min. Confirm error resolved."
          options: [pass, abort]
          on_reject: abort

        - id: rollout-50
          type: gate
          message: "Fix live for 50% of tenants. Observe 30 min."
          options: [pass, abort]
          on_reject: abort

        - id: rollout-100
          type: gate
          message: "Fix live for 100% of tenants. Monitor 2h for stability."
          options: [pass, abort]
          on_reject: abort

  # ──────────────────────────────────────────────────────────────────
  # PHASE 10 — Post-mortem (critical/high only)
  # ──────────────────────────────────────────────────────────────────
  - id: postmortem
    type: if
    condition: "{{ inputs.severity == 'critical' or inputs.severity == 'high' }}"
    then:
      - id: postmortem-doc
        type: prompt
        integration: "{{ inputs.integration }}"
        prompt: |
          Write a blameless post-mortem for the hotfix on "{{ inputs.affected_feature }}":

          BUG: {{ inputs.bug_description }}
          ROOT CAUSE: {{ inputs.root_cause }}
          SEVERITY: {{ inputs.severity }}

          Include:
          - Timeline (detection → root cause confirmed → fix merged → prod stable)
          - Impact (how many tenants/users affected, for how long)
          - Root cause analysis (5 Whys)
          - What worked well in the response
          - What slowed us down
          - Action items to prevent recurrence — EACH WITH AN OWNER:
            1. Missing test → add regression test (done in PHASE 4)
            2. Detection gap → alert or monitoring improvement
            3. Architectural issue → link to follow-up issue
          - Links: error-tracker issue, dashboard panel, PR, post-mortem doc

          Save to: docs/postmortems/{{ inputs.affected_feature }}-<ISO date>.md
