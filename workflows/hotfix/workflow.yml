schema_version: "1.0"

workflow:
  id: "hotfix"
  name: "Hotfix Delivery (Delta-Global)"
  version: "2.0.0"
  author: "satcom"
  description: >-
    Fast path for a production bug on the Delta-Global platform: mitigate
    first (flag OFF or pin back) → scope the root cause → failing regression
    test → minimal fix → gate battery → verify → release(<app>) → staging pin
    → production pin + manual ArgoCD sync → monitor → blameless postmortem
    with owned actions. Skips spec/plan ceremony. Not for new features
    (saas-feature) or substantial schema work (migration-only).

requires:
  speckit_version: ">=0.7.2"
  integrations:
    any: ["claude", "copilot", "gemini"]

inputs:
  bug_description:
    type: string
    required: true
    prompt: "What is broken? The symptom observed, where (env), since when"

  root_cause:
    type: string
    required: true
    prompt: "Root cause, or the current hypothesis"

  fix_description:
    type: string
    required: true
    prompt: "The intended fix, in one sentence"

  affected_area:
    type: string
    required: true
    prompt: "Kebab-case slug of the affected area (e.g. 'sector-feed', 'billing-webhook')"

  severity:
    type: string
    default: "high"
    enum: ["critical", "high", "medium"]
    prompt: "critical (data loss / security / everyone down), high (major feature broken), medium (degraded)"

  feature_flag:
    type: string
    default: "none"
    prompt: "Capability flag guarding the broken behaviour, if any (its key) — or 'none'"

  integration:
    type: string
    default: "auto"
    prompt: "AI coding integration to use (auto, claude, copilot, gemini)"

  needs_migration:
    type: boolean
    default: false
    prompt: "Does the fix need a schema change? (expand-only; anything bigger → migration-only)"

  touches_workers:
    type: boolean
    default: false
    prompt: "Does the fix change apps/workers (Python)?"

  release_apps:
    type: string
    default: "api"
    prompt: "Apps to release (space-separated; api first if a migration ships)"

  lint_cmd:
    type: string
    default: "bunx biome ci ."
    prompt: "Lint command"

  typecheck_cmd:
    type: string
    default: "bun run typecheck"
    prompt: "Typecheck command"

  full_test_cmd:
    type: string
    default: "bun run test"
    prompt: "Full test command"

steps:
  # ──────────────────────────────────────────────────────────────────
  # PHASE 0 — Mitigate before fixing
  # ──────────────────────────────────────────────────────────────────
  - id: mitigate
    type: gate
    message: |
      Stop the bleeding before writing code. Severity: {{ inputs.severity }}.
      - Flag-guarded ({{ inputs.feature_flag }})? → setFeatureFlag OFF in the
        affected env (admin console, reason required). Propagates in ≤ 3 s.
      - Introduced by a release? → pin back:
        `uv run scripts/ship.py promote --env <env> <app> --to <previous>`
        (production also needs `argocd app sync app-stack-production`).
        Rollback is a pin, never a force-push or kubectl apply.
      - Data being corrupted? → pg_dumpall the env first (there are no backups).
      Record what you did and when — it is the postmortem timeline.
    options: [mitigated, not-needed, abort]
    on_reject: abort

  # ──────────────────────────────────────────────────────────────────
  # PHASE 1 — Scope
  # ──────────────────────────────────────────────────────────────────
  - id: scope
    command: speckit.specify
    integration: "{{ inputs.integration }}"
    input:
      args: |
        Hotfix scope for "{{ inputs.affected_area }}" (fix-{{ inputs.affected_area }}).
        BUG: {{ inputs.bug_description }}
        ROOT CAUSE: {{ inputs.root_cause }}
        FIX: {{ inputs.fix_description }}
        SEVERITY: {{ inputs.severity }}

        Write a SHORT spec (skip the intake interview; no stories beyond one):
        - Root cause confirmed with evidence (log line, trace, query, file:line)
          or the investigation still needed
        - Exact files to change — nothing else
        - Blast radius: callers of what changes (grep them), other surfaces
          sharing the predicate/service
        - One AC per symptom: "IF <bug scenario> THEN THE SYSTEM SHALL <correct behaviour>"
        - The regression test that will reproduce it (file path, what it asserts)
        - Monitoring proof: which Grafana panel / GlitchTip issue / log query
          shows the fix worked
        - Rollback: pin back to the previous version (and flag OFF if any)
        Constraints: fix only this bug (open issues for anything else found);
        no refactor; no new flag unless the fix needs a kill switch; schema
        change beyond an expand-only column → use migration-only.

  - id: review-scope
    type: gate
    message: |
      Root cause understood (not just the symptom)? Blast radius acceptable?
      Diff will be minimal? Reject if more investigation is needed.
    options: [approve, reject]
    on_reject: abort
    check: "find specs -path '*{{ inputs.affected_area }}*' -name spec.md | grep -q ."

  - id: branch-guard
    type: shell
    run: "b=$(git rev-parse --abbrev-ref HEAD); case \"$b\" in main|staging|production) echo \"on $b — create fix/{{ inputs.affected_area }}-<id> first\"; exit 1;; esac"

  # ──────────────────────────────────────────────────────────────────
  # PHASE 2 — Failing regression test, then the fix
  # ──────────────────────────────────────────────────────────────────
  - id: regression-test
    command: speckit.implement
    integration: "{{ inputs.integration }}"
    input:
      args: |
        Write ONLY the regression test for: {{ inputs.bug_description }}
        - Where the bug lives: api → apps/api/test/<area>/…test.ts
          (describeIntegration on a real Postgres for DB/predicate bugs — no
          mocks); web → *.test.tsx with installDom(); workers → apps/workers/tests/;
          Temporal → replay history
        - Isolation/authorization bug → name the test with @critical
        - Run it and SHOW IT FAILING on the current code. Paste the failing
          line into the spec. A test that passes before the fix proves nothing.
        Do not change production code in this step.

  - id: review-red
    type: gate
    message: "The regression test fails for the right reason (the bug, not a setup error)?"
    options: [approve, reject]
    on_reject: abort

  - id: migration
    type: if
    condition: "{{ inputs.needs_migration == true }}"
    then:
      - id: schema-fix
        command: speckit.implement
        integration: "{{ inputs.integration }}"
        input:
          args: |
            Make the minimal expand-only schema change for this fix in
            packages/db/src/schema/, then `bun run db:generate`. No DROP /
            RENAME / retype / SET NOT NULL; ADD COLUMN NOT NULL only with a
            constant DEFAULT; new table → --custom RLS block. Never edit an
            existing migration. Do not apply to the shared dev DB.

      - id: migration-checks
        type: shell
        run: "bun run check:migration-immutability origin/main && bun run check:migration-expand-contract origin/main"

      - id: review-migration-sql
        type: gate
        message: |
          Read the generated SQL. It runs in the api db-migrate init container,
          in one transaction, while the previous release still serves.
          Anything beyond a minimal expand → reject and use migration-only.
        options: [approve, reject]
        on_reject: abort

  - id: fix
    command: speckit.implement
    integration: "{{ inputs.integration }}"
    input:
      args: |
        Implement the fix for "{{ inputs.affected_area }}": {{ inputs.fix_description }}
        Touch only the files in the scope. Keep every guard you find: field
        directives, @audited, scope predicates, flag checks, column
        projection, typed error codes. Run the regression test and SHOW IT
        PASSING; run the area's existing tests. One commit:
        `fix(<scope>): <lowercase subject>`.

  # ──────────────────────────────────────────────────────────────────
  # PHASE 3 — Gates
  # ──────────────────────────────────────────────────────────────────
  - id: gate-lint
    type: shell
    run: "{{ inputs.lint_cmd }}"

  - id: gate-structure
    type: shell
    timeout: 600
    run: "bun run depcruise && bun run check:composition-root && bun run check:trpc-removal"

  - id: gate-typecheck
    type: shell
    timeout: 1200
    run: "{{ inputs.typecheck_cmd }}"

  - id: gate-generated
    type: shell
    timeout: 600
    run: "bun --filter='@delta-global/web' codegen:check && bun run check:py-models && bun run scripts/i18n-parity.ts && bun run scripts/i18n-scan.ts"

  - id: gate-tests
    type: shell
    timeout: 2400
    run: "{{ inputs.full_test_cmd }} && bun run check:integration-skip"

  - id: gate-python
    type: if
    condition: "{{ inputs.touches_workers == true }}"
    then:
      - id: gate-workers
        type: shell
        timeout: 1800
        run: "cd apps/workers && uv run ruff check && uv run ruff format --check && uv run ty check && uv run pytest tests/ -rs"

  - id: gate-secrets
    type: shell
    run: "gitleaks detect --source . --redact --no-banner --log-opts=origin/main..HEAD"

  # ──────────────────────────────────────────────────────────────────
  # PHASE 4 — Verify + PR
  # ──────────────────────────────────────────────────────────────────
  - id: verify
    command: speckit.verify
    integration: "{{ inputs.integration }}"
    input:
      args: |
        Verify the hotfix for "{{ inputs.affected_area }}" with evidence:
        - the regression test fails on the unfixed code (git stash the fix,
          run, restore) and passes on the fixed code — record both outputs
        - the original scenario probed against the fixed code (GraphQL
          request / test / browser), not inferred from the diff
        - the blast-radius callers from the scope still behave (their tests ran)
        - the monitoring proof named in the scope is queryable
        Write verify-report.md in the hotfix spec directory.

  - id: self-review
    command: speckit.analyze
    integration: "{{ inputs.integration }}"
    input:
      args: |
        Hotfix diff review: minimal and on-scope; no guard removed (directives,
        @audited, scope predicate, flag check, projection); no raw error text
        to readers; no PII logged; no forbidden pattern; regression test
        asserts exactly the bug.

  - id: pr-description
    type: prompt
    integration: "{{ inputs.integration }}"
    prompt: |
      PR for the hotfix: title `fix(<scope>): <lowercase subject>`; body —
      symptom and impact, root cause (with evidence), the change (files + why),
      regression test (path + what it asserts, red→green evidence), risk,
      rollback (pin back with `ship.py promote --to <previous>`), the
      GlitchTip issue / Grafana panel. Severity: {{ inputs.severity }}.

  - id: ready-for-review
    type: gate
    message: |
      Gates green and verify-report PASS. Push the branch and open the PR;
      confirm CI is actually green before merging (no required checks on
      GitHub Free). critical → a second pair of eyes before merge.
    options: [approve, reject]
    on_reject: abort
    check: "f=$(find specs -path '*{{ inputs.affected_area }}*' -name verify-report.md | head -1); [ -n \"$f\" ] && grep -Eq 'Overall\\*\\*: *PASS' \"$f\""

  # ──────────────────────────────────────────────────────────────────
  # PHASE 5 — Ship
  # ──────────────────────────────────────────────────────────────────
  - id: merged
    type: gate
    message: "Squash-merge once CI is green. Merge is not deploy."
    options: [merged, abort]
    on_reject: abort

  - id: release-authorize
    type: gate
    message: |
      Release {{ inputs.release_apps }}: one empty `release(<app>): <subject>`
      commit + push per app (api first with a migration). Authorize the pushes.
    options: [approve, abort]
    on_reject: abort

  - id: release
    type: prompt
    integration: "{{ inputs.integration }}"
    prompt: |
      `scripts/release.sh --dry-run {{ inputs.release_apps }}` then the real run;
      watch each Release workflow; report the versions built.

  - id: staging-pin
    type: prompt
    integration: "{{ inputs.integration }}"
    prompt: |
      `uv run scripts/ship.py promote --env staging {{ inputs.release_apps }}`,
      commit the pin in platform-infra values-staging.yaml, wait for the sync.

  - id: staging-verify
    type: shell
    timeout: 900
    run: "uv run scripts/ship.py verify --env staging"

  - id: verify-staging
    type: gate
    message: |
      On staging: reproduce the original scenario — fixed? No new GlitchTip
      issue, no new error logs, db-migrate logs clean if a migration shipped.
    options: [verified, abort]
    on_reject: abort

  - id: prod-gate
    type: gate
    message: |
      Promote exactly the staging-verified versions to PRODUCTION.
      Rollback = `ship.py promote --env production <app> --to <previous>` + sync.
      Type DEPLOY to confirm.
    options: [DEPLOY, abort]
    on_reject: abort

  - id: prod-pin
    type: prompt
    integration: "{{ inputs.integration }}"
    prompt: |
      `uv run scripts/ship.py promote --env production {{ inputs.release_apps }}`,
      commit the pin, `argocd app diff app-stack-production`, show it,
      `argocd app sync app-stack-production`. If the bug was flag-guarded
      ({{ inputs.feature_flag }}), turn the flag back ON only after the next gate.

  - id: prod-verify
    type: shell
    timeout: 900
    run: "uv run scripts/ship.py verify --env production"

  - id: monitor
    type: gate
    message: |
      Monitor production for 2 h: zero new occurrences of the original error
      (GlitchTip), error rate and p95 back to baseline (Grafana), nothing new
      in the logs. Then re-enable the flag if one was turned off.
    options: [stable, abort]
    on_reject: abort

  # ──────────────────────────────────────────────────────────────────
  # PHASE 6 — Postmortem (critical / high)
  # ──────────────────────────────────────────────────────────────────
  - id: postmortem
    type: if
    condition: "{{ inputs.severity == 'critical' or inputs.severity == 'high' }}"
    then:
      - id: postmortem-doc
        type: prompt
        integration: "{{ inputs.integration }}"
        prompt: |
          Write a blameless postmortem at docs/postmortems/<YYYY-MM-DD>-{{ inputs.affected_area }}.md:
          - SEV ({{ inputs.severity }}), impact (who, how many, how long), detection
            (how we found out — alert, user, luck?)
          - Timeline: introduced (release/commit) → detected → mitigated → fixed
            → verified in production, with timestamps
          - Root cause and contributing causes (5 whys — stop at a process
            or a missing check, not at a person)
          - Why no gate caught it: which check, test or alert would have —
            and whether it exists but runs nowhere (a recurring failure mode here)
          - Actions, EACH with an owner and a date: the regression test (done),
            a detection gap → alert rule in platform-infra
            charts/grafana/alerting/, a prevention → check script / kit rule
            (propose a CONVENTIONS.md change), a runbook update in docs/runbooks/
          Copy the open actions into the area's follow-ups.md with owners.
