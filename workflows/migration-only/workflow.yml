schema_version: "1.0"

workflow:
  id: "migration-only"
  name: "DB Migration Delivery (Delta-Global)"
  version: "2.0.0"
  author: "satcom"
  description: >-
    Schema-only change on the Delta-Global Postgres, shaped by how migrations
    really run there: the api db-migrate init container applies every pending
    migration in ONE transaction while the previous release still serves, and
    there are no database backups. Models expand / contract / backfill /
    index / constraint explicitly, runs the repo's check:migration-* gates,
    uses the Allow-Contract-Migration trailer only with evidence, snapshots
    with pg_dumpall before data-rewriting steps, and keeps a migration record.

requires:
  speckit_version: ">=0.7.2"
  integrations:
    any: ["claude", "copilot", "gemini"]

inputs:
  migration_slug:
    type: string
    required: true
    prompt: "Kebab-case slug for the change (e.g. 'drop-sectors-legacy-keywords')"

  migration_description:
    type: string
    required: true
    prompt: "What schema change is needed?"

  motivation:
    type: string
    required: true
    prompt: "Why — link the spec, issue or follow-up that requires it"

  affected_tables:
    type: string
    required: true
    prompt: "Affected tables (comma-separated, snake_case)"

  migration_type:
    type: string
    required: true
    enum: ["expand", "contract", "backfill", "index", "constraint"]
    prompt: >-
      expand (new table / nullable or defaulted column / new index on a NEW table),
      contract (drop/rename-completion of what no running release uses — needs the trailer),
      backfill (data migration — not covered by the check script),
      index (index on an EXISTING table),
      constraint (NOT NULL / CHECK / FK on an existing table via NOT VALID + VALIDATE)

  table_size:
    type: string
    default: "small"
    enum: ["small", "medium", "large"]
    prompt: "Largest affected table: small (<100k rows), medium (100k–10M), large (>10M) — measure it"

  integration:
    type: string
    default: "auto"
    prompt: "AI coding integration to use (auto, claude, copilot, gemini)"

  typecheck_cmd:
    type: string
    default: "bun run typecheck"
    prompt: "Typecheck command"

  full_test_cmd:
    type: string
    default: "bun run test"
    prompt: "Full test command (with INTEGRATION_DB_URL set)"

steps:
  # ──────────────────────────────────────────────────────────────────
  # PHASE 0 — Scope (which phase of expand-contract is this?)
  # ──────────────────────────────────────────────────────────────────
  - id: scope
    command: speckit.specify
    integration: "{{ inputs.integration }}"
    input:
      args: |
        Migration scope "{{ inputs.migration_slug }}" — tables {{ inputs.affected_tables }}.
        CHANGE: {{ inputs.migration_description }}
        MOTIVATION: {{ inputs.motivation }}
        TYPE: {{ inputs.migration_type }} · TABLE SIZE: {{ inputs.table_size }}

        Write a short spec (no intake interview) following
        docs/how-to/database-migrations.md:
        - Exact schema edits (packages/db/src/schema/… file + column/table)
        - Measured row counts per affected table and environment (query them;
          "assumed" is not accepted for index or backfill work)
        - Expand-contract placement:
            expand     → forward-compatible with the running release by construction
            contract   → evidence the running releases no longer use it: the
                         release that stopped (<app> v<x>, PR #), live in staging
                         AND production (read platform-infra values-<env>.yaml
                         pins) — this becomes the Allow-Contract-Migration trailer
            backfill   → idempotent, batched, dry-run, consistency query
            index      → small: trailer with the row count; large: built
                         CONCURRENTLY by hand in staging and production first,
                         migration uses IF NOT EXISTS + trailer
            constraint → backfill in release N; CHECK … NOT VALID + VALIDATE
                         via --custom in N+1; SET NOT NULL (trailer) after
        - Statements check:migration-expand-contract will flag, and why each is safe
        - Undo: runnable SQL, or IRREVERSIBLE with a named sign-off
        - Snapshot need: data rewritten or deleted → pg_dumpall per env first
        - The application code that must ship BEFORE (contract) or AFTER (expand)
        No application code in this workflow — open a saas-feature/hotfix for it.

  - id: review-scope
    type: gate
    message: |
      Type {{ inputs.migration_type }} on {{ inputs.affected_tables }} ({{ inputs.table_size }}).
      - Placement correct; a contract cites the release that stopped using the
        shape AND that it runs in staging and production
      - Safe while the previous release serves (the migrator holds every lock
        until the whole batch commits — 0028 dropped admin_audit_log under live pods)
      - Undo runnable, or IRREVERSIBLE signed off
    options: [approve, reject]
    on_reject: abort
    check: "find specs -path '*{{ inputs.migration_slug }}*' -name spec.md | grep -q ."

  - id: branch-guard
    type: shell
    run: "b=$(git rev-parse --abbrev-ref HEAD); case \"$b\" in main|staging|production) echo \"on $b — create chore/{{ inputs.migration_slug }}-<id> first\"; exit 1;; esac"

  # ──────────────────────────────────────────────────────────────────
  # PHASE 1 — Schema change + generated SQL
  # ──────────────────────────────────────────────────────────────────
  - id: schema-change
    command: speckit.implement
    integration: "{{ inputs.integration }}"
    input:
      args: |
        Implement "{{ inputs.migration_description }}" ({{ inputs.migration_type }}).
        - Edit only packages/db/src/schema/ (and packages/db/src/*-dal.ts if a
          column projection must follow)
        - `bun run db:generate` — never hand-write the migration; --custom only
          for RLS (new table: RLS on + app_full_access TO app, guarded by
          IF EXISTS pg_roles 'app', precedent 0057), CHECK … NOT VALID /
          VALIDATE, triggers, REVOKE — justified in the spec
        - Never edit, rename or delete a migration already on main
        - contract: first prove no code references the column/table
          (grep apps/, packages/, and the Python workers' SQL)
        - index on an existing table: CREATE INDEX … IF NOT EXISTS; the
          CONCURRENTLY build happens by hand per env (Phase 4)

  - id: migration-gates
    type: shell
    run: "bun run check:migration-immutability origin/main && bun run check:migration-expand-contract origin/main"

  - id: trailer
    type: if
    condition: "{{ inputs.migration_type == 'contract' or inputs.migration_type == 'index' or inputs.migration_type == 'constraint' }}"
    then:
      - id: trailer-check
        type: gate
        message: |
          The expand-contract check flags this by design. If — and only if —
          the scope's evidence holds, add the commit trailer:
            Allow-Contract-Migration: <migration> <what is removed/locked>; unused since <app> v<x> (#PR), live in staging and production
          (index: give the measured row count). It downgrades the findings to
          warnings; it does not make the migration safe.
        options: [approve, reject]
        on_reject: abort
        check: "git log origin/main..HEAD --format=%B | grep -q '^Allow-Contract-Migration:'"
        on_check_fail: warn

  - id: backfill
    type: if
    condition: "{{ inputs.migration_type == 'backfill' }}"
    then:
      - id: backfill-script
        command: speckit.implement
        integration: "{{ inputs.integration }}"
        input:
          args: |
            Write the backfill as packages/db/src/scripts/backfill-{{ inputs.migration_slug }}.ts
            (Drizzle, no raw SQL unless justified): keyset batches of 1,000 by
            (created_at, id), idempotent (WHERE target IS NULL), --dry-run,
            a per-run cap with resumable checkpoint, progress logs through
            @delta-global/logger (counts only — no row contents, no emails),
            and a final consistency query printing remaining rows. Plus an
            integration test (describeIntegration) proving idempotency: second
            run updates 0 rows.

      - id: review-backfill
        type: gate
        message: "Idempotent, batched, dry-run works, consistency query present, no PII logged?"
        options: [approve, reject]
        on_reject: abort

  - id: review-migration-sql
    type: gate
    message: |
      Read every generated statement in packages/db/drizzle/ before anything applies.
      - [ ] Nothing the RUNNING release reads or writes is dropped, renamed, retyped or made NOT NULL
      - [ ] ADD COLUMN NOT NULL only with a constant DEFAULT
      - [ ] No TRUNCATE; no DML in the migration (backfills are scripts)
      - [ ] Index on an existing {{ inputs.table_size }} table handled per the recipe
      - [ ] New table has its RLS block
      - [ ] Lock duration acceptable — the whole pending batch is ONE transaction
    options: [approve, reject]
    on_reject: abort

  # ──────────────────────────────────────────────────────────────────
  # PHASE 2 — Apply to a disposable database + gates
  # ──────────────────────────────────────────────────────────────────
  - id: apply-disposable
    type: gate
    message: |
      Apply to a DISPOSABLE database only — never the shared dev DB unasked:
      port-forward svc/platform-pg-test-rw (ns platform) to 15432, point
      DATABASE_URL/INTEGRATION_DB_URL at it, `bun run db:migrate`, then
      inspect the result with psql (\d+ <table>). Re-run db:migrate: no-op.
    options: [applied, abort]
    on_reject: abort

  - id: gate-typecheck
    type: shell
    timeout: 1200
    run: "{{ inputs.typecheck_cmd }}"

  - id: gate-tests
    type: shell
    timeout: 2400
    run: "{{ inputs.full_test_cmd }} && bun run check:integration-skip && bun test scripts/check-migration-expand-contract.test.ts"

  - id: gate-lint
    type: shell
    run: "bunx biome ci . && bun run check:py-models"

  # ──────────────────────────────────────────────────────────────────
  # PHASE 3 — Verify, record, PR
  # ──────────────────────────────────────────────────────────────────
  - id: verify
    command: speckit.verify
    integration: "{{ inputs.integration }}"
    input:
      args: |
        Verify migration "{{ inputs.migration_slug }}" with evidence:
        - migration file(s) present, immutable-check and expand-contract-check outputs recorded
        - applied cleanly to a disposable DB, second apply a no-op (outputs)
        - schema shape probed in the DB (psql \d+), not read from the ORM file
        - contract: grep evidence of zero references + the pins proving the
          releases that stopped using it run in staging and production
        - backfill: dry-run output, idempotency test output, consistency query
        - undo SQL executed against a throwaway DB, or IRREVERSIBLE signed off
        Write verify-report.md in the migration's spec directory.

  - id: migration-record
    type: prompt
    integration: "{{ inputs.integration }}"
    prompt: |
      Create docs/database/migration-records/<YYYY-MM-DD>-{{ inputs.migration_slug }}.md:
      - Change, type ({{ inputs.migration_type }}), tables, motivation
      - Migration file(s) and their journal numbers; backfill script (or n/a)
      - Trailer used (verbatim) and its evidence, or "none"
      - Measured row counts per env before; snapshot file per env (pg_dumpall) or "not needed: why"
      - Undo SQL or IRREVERSIBLE + who signed off
      - Applied: staging <date, api version, db-migrate log line, by> ·
        production <date, api version, db-migrate log line, by> — filled at each step
      - Follow-up: the later release that contracts what this expands (date + check query)

  - id: pr-description
    type: prompt
    integration: "{{ inputs.integration }}"
    prompt: |
      PR: title `feat(db): …` or `fix(db): …` (lowercase subject); body — the
      statements, expand-contract placement and evidence, why the running
      release is unaffected, lock/duration estimate from measured row counts,
      undo, snapshot plan, link to the migration record, and the release
      order (api first; it applies the migration through db-migrate).

  - id: ready-for-review
    type: gate
    message: |
      Open the PR; confirm CI green (lint-typecheck runs both migration
      checks on PRs). contract / constraint → a second reviewer.
    options: [approve, reject]
    on_reject: abort
    check: "ls docs/database/migration-records/ 2>/dev/null | grep -q '{{ inputs.migration_slug }}'"

  # ──────────────────────────────────────────────────────────────────
  # PHASE 4 — Staging, then production (via the api release)
  # ──────────────────────────────────────────────────────────────────
  - id: concurrent-index
    type: if
    condition: "{{ inputs.migration_type == 'index' and inputs.table_size != 'small' }}"
    then:
      - id: build-index-by-hand
        type: gate
        message: |
          BEFORE releasing: build the index CONCURRENTLY by hand in staging,
          then production (outside a transaction), e.g.
            kubectl -n <env> exec -it platform-pg-1 -- psql -U postgres platform
            CREATE INDEX CONCURRENTLY IF NOT EXISTS …;
          Check it is VALID (pg_index.indisvalid). The migration's IF NOT EXISTS
          then makes the init container a no-op for it. Record times in the record.
        options: [built, abort]
        on_reject: abort

  - id: snapshot-staging
    type: gate
    message: |
      Data rewritten or deleted? Snapshot staging first (no backups exist):
        kubectl -n staging exec platform-pg-1 -- pg_dumpall -U postgres > backup-staging-<date>.sql
      Store it off-cluster and note it in the migration record. Choose
      'not-needed' for a pure expand.
    options: [done, not-needed, abort]
    on_reject: abort

  - id: release-api
    type: prompt
    integration: "{{ inputs.integration }}"
    prompt: |
      After merge (and with the user's push authorization): release the api —
      `scripts/release.sh api` — then `uv run scripts/ship.py promote --env staging api`
      and commit the pin in platform-infra values-staging.yaml. The db-migrate
      init container applies the migration (advisory lock); a failure keeps the
      new api pods from starting while the old ones keep serving — see
      docs/runbooks/db-migration-failed.md.

  - id: verify-staging
    type: gate
    message: |
      Staging: db-migrate init container log shows success; api pods Ready;
      `uv run scripts/ship.py verify --env staging` clean; schema probed with
      psql; affected features smoke-tested; no new GlitchTip issues.
      Backfill? run it now (dry-run, live, re-run = 0 rows) and record counts.
    options: [verified, abort]
    on_reject: abort

  - id: prod-gate
    type: gate
    message: |
      PRODUCTION. Snapshot first if data is rewritten
      (kubectl -n production exec platform-pg-1 -- pg_dumpall -U postgres > …),
      then pin exactly the staging-verified api version. Type DEPLOY.
    options: [DEPLOY, abort]
    on_reject: abort

  - id: prod-apply
    type: prompt
    integration: "{{ inputs.integration }}"
    prompt: |
      `uv run scripts/ship.py promote --env production api`, commit the pin,
      `argocd app diff app-stack-production`, show it, `argocd app sync
      app-stack-production`. Watch the db-migrate log; then
      `uv run scripts/ship.py verify --env production`. Run the backfill in
      production if any (dry-run first). Fill the record's Applied section.

  - id: verify-prod
    type: gate
    message: |
      30 min after apply: pods healthy, no crash loops, no lock waits or slow
      queries on the affected tables (Grafana), no new errors. Undo path is in
      the migration record.
    options: [stable, abort]
    on_reject: abort

  - id: follow-up
    type: prompt
    integration: "{{ inputs.integration }}"
    prompt: |
      Close out: migration record complete (all Applied rows, final counts).
      If this was an EXPAND that a later CONTRACT must finish, add a
      follow-ups.md entry (owner, earliest date = once the release that stops
      using the old shape is live in staging AND production, the check query).
      If the docs/how-to/database-migrations.md recipe was wrong or missing
      a case you hit, propose the fix.
