schema_version: "1.0"

workflow:
  id: "saas-feature"
  name: "SaaS Feature Delivery Cycle"
  version: "1.2.0"
  author: "satcom"
  description: >-
    Production-grade feature delivery for a multi-tenant SaaS webapp.
    Drives the full cycle: scope → RFC → schema → DAL → services → API →
    UI → E2E → quality gates → verify → PR → progressive rollout →
    observability. Every tool command is an input with a default, so the
    workflow adapts to any Next.js/TypeScript SaaS; the defaults assume a
    Bun + Turborepo monorepo with tRPC and Drizzle (see inputs).

requires:
  speckit_version: ">=0.7.2"
  integrations:
    any: ["claude", "copilot", "gemini"]

inputs:
  feature_name:
    type: string
    required: true
    prompt: "Short feature slug (kebab-case, e.g. 'post-publishing')"

  feature_description:
    type: string
    required: true
    prompt: "One-line description of what the feature does for the user"

  integration:
    type: string
    default: "auto"
    prompt: "AI coding integration to use (auto, claude, copilot, gemini)"

  api_app:
    type: string
    default: "apps/api"
    prompt: "Path to the API app"

  web_app:
    type: string
    default: "apps/web"
    prompt: "Path to the web app (Next.js)"

  db_package:
    type: string
    default: "@delta-global/db"
    prompt: "DB schema package name"

  shared_package:
    type: string
    default: "@delta-global/shared"
    prompt: "Shared validation-schema package name"

  needs_migration:
    type: boolean
    default: true
    prompt: "Does this feature require a DB migration?"

  needs_durable_workflow:
    type: boolean
    default: false
    prompt: "Does this feature need a durable workflow (e.g. Temporal)?"

  needs_analytics:
    type: boolean
    default: false
    prompt: "Does this feature write product analytics events?"

  rollout_strategy:
    type: string
    default: "progressive"
    enum: ["progressive", "internal-only", "all-tenants"]
    prompt: "Rollout strategy after merge"

  install_cmd:
    type: string
    default: "bun install"
    prompt: "Dependency install command"

  lint_cmd:
    type: string
    default: "bun run lint"
    prompt: "Lint command"

  typecheck_cmd:
    type: string
    default: "bun run typecheck"
    prompt: "Typecheck command"

  deadcode_cmd:
    type: string
    default: "bun run knip"
    prompt: "Dead-code / unused-exports check command (empty CI job? remove it from tasks too)"

  build_cmd:
    type: string
    default: "turbo run build --filter=...[HEAD^1]"
    prompt: "Build command for affected packages"

  secretscan_cmd:
    type: string
    default: "gitleaks detect --no-banner"
    prompt: "Secret scan command"

  dep_audit_cmd:
    type: string
    default: "bun pm audit --severity high"
    prompt: "Dependency audit command"

  test_cmd:
    type: string
    default: "bun test"
    prompt: "Unit/integration test runner command (file path appended)"

  e2e_cmd:
    type: string
    default: "bun run test:e2e"
    prompt: "E2E test command (--grep filters appended)"

  migrate_generate_cmd:
    type: string
    default: "bun --filter @delta-global/db drizzle-kit generate"
    prompt: "Command that generates a migration from the schema"

  migrate_apply_cmd:
    type: string
    default: "bun --filter @delta-global/db drizzle-kit migrate"
    prompt: "Command that applies migrations locally"

steps:
  # ──────────────────────────────────────────────────────────────────
  # PHASE 0 — Product scoping
  # ──────────────────────────────────────────────────────────────────
  - id: scope
    command: speckit.specify
    integration: "{{ inputs.integration }}"
    input:
      args: |
        Feature: {{ inputs.feature_name }}
        Description: {{ inputs.feature_description }}

        Run the full intake interview with the user before writing the scope
        (skip automatically if no user is available in this run).

        Produce a complete product scope:
        - User story (As [role] / I want [action] / So that [benefit])
        - Acceptance criteria in EARS syntax (WHEN/WHILE/IF-THEN/SHALL), binary yes/no
        - Non-goals (what is explicitly out of scope)
        - Roles affected (use the project's real role set from the constitution)
        - Primary path and alternate paths (numbered steps)
        - Edge cases (empty lists, max length, timeouts, offline, Unicode)
        - Success metrics: adoption %, J7/J30 retention, p95 latency, error rate
        - Marginal cost estimate (DB rows, analytics events, background jobs,
          storage, external API calls)
        - Rollback thresholds (e.g. "rollback if error rate > 2% or p95 > 800ms")
        - GDPR classification of any PII collected, with retention policy

  - id: scope-checklist
    command: speckit.checklist
    integration: "{{ inputs.integration }}"
    input:
      args: >-
        Validate that the scope is complete, testable, and that every
        acceptance criterion is EARS-format and binary (yes/no verifiable).
        Flag any criterion containing "should", "ideally", "if possible".

  - id: review-scope
    type: gate
    message: |
      Review the product scope before tech design.
      Required approvers: PM (need) + tech lead (feasibility) + design (UX).
      Check: EARS criteria, measurable metrics, rollback thresholds set.
    options: [approve, reject]
    on_reject: abort
    check: "find specs -type f -name 'spec.md' -path '*{{ inputs.feature_name }}*' | grep -q ."

  # ──────────────────────────────────────────────────────────────────
  # PHASE 1 — Technical RFC (design-only PR)
  # ──────────────────────────────────────────────────────────────────
  - id: rfc
    command: speckit.plan
    integration: "{{ inputs.integration }}"
    input:
      args: |
        Produce the technical RFC for "{{ inputs.feature_name }}":

        1. DB SCHEMA in {{ inputs.db_package }}
           - Tenant-key FK + index on each tenant-scoped table (per constitution)
           - createdAt / updatedAt timestamps with timezone
           - Composite indexes for frequent filter+sort queries
           - Unique / check constraints explicit
           - Soft-delete vs hard-delete decision documented

        2. VALIDATION SCHEMAS in {{ inputs.shared_package }}
           - One input schema per API endpoint, named explicitly
           - Output DTO schemas (omit tokens, hashes, internal fields)
           - Business error union types as `const` literals
           - Discriminated unions for variants
           - No z.any(), no z.unknown(), no z.record(z.any())

        3. API SURFACE in {{ inputs.api_app }}
           - Each endpoint: name, query|mutation, input/output, min role
           - Tenant-scoped entry point for tenant-scoped operations
           - Raw HTTP routes ONLY for webhooks / mobile / streaming

        4. DAL FUNCTIONS in {{ inputs.api_app }}/src/dal/{{ inputs.feature_name }}.ts
           - Read functions, one per business use case
           - Tenant key required as explicit parameter
           - Cache keys and TTL listed

        5. SERVICES (pure) in {{ inputs.api_app }}/src/services/{{ inputs.feature_name }}.ts
           - Result<T, E> discriminated unions, no throw
           - No db / auth / cache / framework imports

        6. FEATURE FLAG
           - Name: ff-{{ inputs.feature_name }} (follow the project registry's naming exactly)
           - Registry location (file path where the key MUST be added)
           - Granularity (global / tenant / user / percentage — only what the
             project's flag system actually supports)
           - Kill switch propagation time
           - Planned removal date

        7. CACHE STRATEGY
           - Keys, TTL per key type
           - Invalidation list per mutation + blast-radius statement
           - Client query-key alignment

        8. BACKGROUND JOBS
           - Durable workflow vs fire-and-forget queue decision per side-effect
           - Job/workflow IDs idempotent
           - Activities isolate external effects

        9. RBAC MATRIX
           - Action × role table using the project's real role set

        10. OBSERVABILITY
            - Span/metric attributes: tenant id, user id, endpoint name
            - Structured log fields
            - Analytics events named feature.action

        11. SERVICE INTERACTION MAP (mandatory sweep)
            - One row per service the platform has: frontend, API, DB,
              cache, background workers, durable workflows, external APIs
              (LLM/email/payment/...), auth, realtime, analytics, storage
            - Each row: touched yes/no, interaction type, changes needed,
              and behavior when that service is down or slow
            - "Not touched" requires a one-line reason — no blank rows
            - Every external API call names timeout, retry budget,
              fallback behavior, and marginal cost
            - Every "yes" row must be reflected in blocks 1-10 and in the
              testing plan (a failure-mode test per touched service)

        HARD CONSTRAINTS (any violation aborts the RFC):
        - Migrations generated by ORM tooling only — no handwritten SQL
        - No analytics-store imports from app code
        - Tenant key on every tenant-scoped table, query, cache key
        - Secrets via the project's secret manager, never bare env access

  - id: rfc-analyze
    command: speckit.analyze
    integration: "{{ inputs.integration }}"
    input:
      args: >-
        Cross-check the RFC: every table is referenced by at least one DAL or
        endpoint, every schema matches an endpoint, every cache tag has
        an invalidation site, every RBAC entry maps to an endpoint, and the
        Service Interaction Map is consistent — every "yes" row has a
        corresponding design block, and no design block touches a service
        the map marks "no". Report any orphan or missing piece.

  - id: rfc-checklist
    command: speckit.checklist
    integration: "{{ inputs.integration }}"
    input:
      args: |
        Validate the RFC against:
        - Every tenant table has the tenant-key FK + index
        - Every endpoint has input validation + role requirement + cache invalidation
        - Service Interaction Map complete: explicit yes/no for every platform
          service, no blank rows, reasons on every "not touched"
        - Every external API row names timeout / retry / fallback / cost cap
        - Every touched service has a failure-mode entry in the testing plan
        - Analytics writes go to the analytics store, not the primary DB
        - Feature flag declared with registry location and kill switch
        - GDPR data classification consistent across layers
        - No raw SQL anywhere
        - No analytics-store imports in app code

  - id: review-rfc
    type: gate
    message: |
      Review the technical RFC.
      This is a DESIGN-ONLY PR (schemas + RFC.md). It must be merged BEFORE
      the implementation PR is opened.
      Reviewers: tech lead minimum, +1 if billing/auth/security touched.
    options: [approve, reject, revise]
    on_reject: abort
    check: "find specs -type f -name 'plan.md' -path '*{{ inputs.feature_name }}*' | grep -q ."

  # ──────────────────────────────────────────────────────────────────
  # PHASE 2 — Scaffolding
  # ──────────────────────────────────────────────────────────────────
  - id: branch
    type: shell
    run: "git checkout main && git pull && git checkout -b feat/{{ inputs.feature_name }}"

  - id: scaffold
    type: prompt
    integration: "{{ inputs.integration }}"
    prompt: |
      Create the empty file structure for feature "{{ inputs.feature_name }}"
      following the plan's File Map:

      DB / contracts:
      - schema file in {{ inputs.db_package }}
      - validation schemas in {{ inputs.shared_package }}

      API ({{ inputs.api_app }}):
      - API surface file (router / actions / handlers)
      - src/dal/{{ inputs.feature_name }}.ts        (with `import "server-only"`)
      - src/services/{{ inputs.feature_name }}.ts
      - test/{{ inputs.feature_name }}/{dal,services,procedures}.test.ts

      Web ({{ inputs.web_app }}):
      - the feature's route segment: page.tsx, loading.tsx, error.tsx
      - components/features/{{ inputs.feature_name }}/index.ts
      - the feature's e2e directory

      Wire the feature flag `ff-{{ inputs.feature_name }}` in the project's
      flag registry, OFF by default. Add server-side guards in the page
      (redirect on OFF) and in every API entry point (FORBIDDEN on OFF).

      Add new env vars to the project's validated env module and to the
      secret manager. Update .env.example.

      Do NOT use relative cross-workspace imports. Always import via the
      workspace package scope.

  - id: scaffold-check
    type: shell
    run: "{{ inputs.install_cmd }} && {{ inputs.lint_cmd }} && {{ inputs.typecheck_cmd }}"

  - id: scaffold-pr
    type: prompt
    integration: "{{ inputs.integration }}"
    prompt: >-
      Open a draft PR with the scaffold, linked to the RFC PR. Verify CI
      is green on the empty structure before continuing.

  # ──────────────────────────────────────────────────────────────────
  # PHASE 3 — DB schema & migration (conditional)
  # ──────────────────────────────────────────────────────────────────
  - id: db
    type: if
    condition: "{{ inputs.needs_migration == true }}"
    then:
      - id: schema
        command: speckit.tasks
        integration: "{{ inputs.integration }}"
        input:
          args: |
            Implement the DB schema in {{ inputs.db_package }} for
            "{{ inputs.feature_name }}" per the approved RFC. Requirements:
            - Primary keys per project convention
            - Tenant-key FK per constitution, onDelete justified
            - Timestamps with timezone
            - Indexes on (tenant key, createdAt desc) at minimum
            - Export inferred row/insert types
            - Declare relations where applicable
            - Add inline comments on non-obvious columns

      - id: migration-generate
        type: shell
        run: "{{ inputs.migrate_generate_cmd }}"

      - id: review-migration
        type: gate
        message: |
          Review the generated SQL migration line by line.
          - No NOT NULL on existing table without default
          - No destructive DROP without expand-contract plan (add → backfill → switch → drop)
          - CREATE INDEX CONCURRENTLY on tables > 100k rows
          - Two-step backfill plan if data transformation needed
          REMEMBER: never handwrite SQL (generated migrations only).
        options: [approve, reject]
        on_reject: abort

      - id: migration-apply-local
        type: shell
        run: "{{ inputs.migrate_apply_cmd }}"

      - id: seeds
        command: speckit.tasks
        integration: "{{ inputs.integration }}"
        input:
          args: >-
            Add seed data in the project's seed script. Create at least 2
            tenants with data each to enable tenant-isolation tests.
            Idempotent seeds. Realistic data (no "test1", "foo"). Include
            Unicode and max-length edge cases.

  # ──────────────────────────────────────────────────────────────────
  # PHASE 4 — Validation contracts
  # ──────────────────────────────────────────────────────────────────
  - id: contracts
    command: speckit.tasks
    integration: "{{ inputs.integration }}"
    input:
      args: |
        Implement validation schemas in {{ inputs.shared_package }} for
        "{{ inputs.feature_name }}":
        - One input schema per API endpoint (createXInput, updateXInput, etc.)
        - One output DTO schema per query/mutation (omit sensitive fields)
        - Business error union as `const` literals
        - Precise constraints: .min, .max, .regex, .email, .url
        - Discriminated unions for variants
        - No z.any, no z.unknown, no z.record(z.any)
        - Export from the package barrel

  - id: contracts-typecheck
    type: shell
    run: "{{ inputs.typecheck_cmd }}"

  # ──────────────────────────────────────────────────────────────────
  # PHASE 5 — DAL (reads)
  # ──────────────────────────────────────────────────────────────────
  - id: dal
    command: speckit.tasks
    integration: "{{ inputs.integration }}"
    input:
      args: |
        Implement DAL in {{ inputs.api_app }}/src/dal/{{ inputs.feature_name }}.ts:
        - First line: import "server-only"
        - One function per business use case (not per table)
        - Tenant key is required, never optional
        - Session verified, then membership/ownership checked
        - Tenant-key filter on EVERY query
        - Cursor-based pagination only
        - Whitelisted sort columns
        - Explicit column selection (no SELECT *, no bare-table select that
          drags wide columns like embeddings/content into list reads)
        - Exclude tokens, hashes, secrets from returns
        - Cache per plan §8 (key shape and TTL from the plan)
        - Wrap with React `cache()` for intra-request dedup
        - JSDoc on every public function

  - id: dal-tests
    command: speckit.tasks
    integration: "{{ inputs.integration }}"
    input:
      args: |
        Write DAL tests in {{ inputs.api_app }}/test/{{ inputs.feature_name }}/dal.test.ts
        against a real (ephemeral if available) database:
        - happy path per function
        - cross-tenant isolation: user of tenant A querying tenant B → empty/throw
        - no session → UNAUTHORIZED
        - no membership → FORBIDDEN
        - pagination (page 1, cursor, last page)
        - cache hit: 2 calls → 1 DB query

  - id: run-dal-tests
    type: shell
    run: "{{ inputs.test_cmd }} {{ inputs.api_app }}/test/{{ inputs.feature_name }}/dal.test.ts"

  # ──────────────────────────────────────────────────────────────────
  # PHASE 6 — Services (pure logic)
  # ──────────────────────────────────────────────────────────────────
  - id: services
    command: speckit.tasks
    integration: "{{ inputs.integration }}"
    input:
      args: |
        Implement pure service functions in
        {{ inputs.api_app }}/src/services/{{ inputs.feature_name }}.ts:
        - Zero imports from db, auth, cache, framework, headers, cookies
        - Result<T, E> discriminated union for outcomes (no throw on business errors)
        - 'now' and 'rng' injected as parameters (no Date.now / Math.random direct)
        - Single responsibility per function
        - Guard clauses on top, happy path at bottom
        - Nesting < 2 levels
        - Composable inputs/outputs

  - id: services-tests
    command: speckit.tasks
    integration: "{{ inputs.integration }}"
    input:
      args: |
        Write service tests in {{ inputs.api_app }}/test/{{ inputs.feature_name }}/services.test.ts:
        - 100% branch coverage
        - Every error code returnable is asserted
        - Edge cases: empty string, max length, 0, -1, Unicode, emoji
        - Property-based tests if combinatorial logic
        - No mocks needed (pure functions)
        - < 100ms total runtime per file

  - id: run-services-tests
    type: shell
    run: "{{ inputs.test_cmd }} {{ inputs.api_app }}/test/{{ inputs.feature_name }}/services.test.ts"

  # ──────────────────────────────────────────────────────────────────
  # PHASE 7 — API surface
  # ──────────────────────────────────────────────────────────────────
  - id: procedures
    command: speckit.tasks
    integration: "{{ inputs.integration }}"
    input:
      args: |
        Implement the API surface for "{{ inputs.feature_name }}" in
        {{ inputs.api_app }} per plan §3:
        - Wire the router/actions into the app's API entry point
        - Tenant-scoped entry point (tenant key extracted from the session,
          NEVER from input)
        - Input schemas imported from {{ inputs.shared_package }}, never inlined
        - Output schemas for typed contracts to the client
        - Endpoint named for observability (span/metric name)
        - Role check via session role (delegate logic to service)
        - Quota check against plan/entitlements where applicable
        - Rate limit on writes (key: rl:endpoint:{userId})
        - Transactions for multi-table mutations
        - Cache invalidation exactly as listed in plan §8
        - Background work started idempotently (deterministic IDs)
        - Errors: typed code, generic client message, stack to the error tracker
        - Constraint violations translated to typed business errors

  - id: procedures-tests
    command: speckit.tasks
    integration: "{{ inputs.integration }}"
    input:
      args: |
        Write API integration tests against real DB + cache:
        - happy path per endpoint
        - no session → UNAUTHORIZED
        - no membership → FORBIDDEN
        - insufficient role → FORBIDDEN
        - invalid input → validation error formatted to fields
        - idempotency: 2× same call → stable state, no duplicate
        - quota exceeded → typed business error
        - cache invalidation site verified (correct cache key deleted)
        - background-work start verified with a mocked client

  - id: run-procedures-tests
    type: shell
    run: "{{ inputs.test_cmd }} {{ inputs.api_app }}/test/{{ inputs.feature_name }}/procedures.test.ts"

  # ──────────────────────────────────────────────────────────────────
  # PHASE 8 — Durable workflow (conditional)
  # ──────────────────────────────────────────────────────────────────
  - id: durable
    type: if
    condition: "{{ inputs.needs_durable_workflow == true }}"
    then:
      - id: workflow
        command: speckit.tasks
        integration: "{{ inputs.integration }}"
        input:
          args: |
            Implement the durable workflow for "{{ inputs.feature_name }}" in
            the project's workflow package:
            - Idempotent workflow ID
            - Retry policy + timeouts (StartToClose, ScheduleToClose, Heartbeat)
            - Activities isolate external effects (emails, third-party APIs)
            - Workflow code is deterministic: no Date.now, no Math.random,
              no direct I/O — use workflow APIs only
            - Test with the engine's test environment + time skipping

      - id: workflow-tests
        type: shell
        run: "{{ inputs.test_cmd }} packages/temporal-workflows/test/{{ inputs.feature_name }}.test.ts"

  # ──────────────────────────────────────────────────────────────────
  # PHASE 9 — UI (Next.js App Router)
  # ──────────────────────────────────────────────────────────────────
  - id: ui
    command: speckit.tasks
    integration: "{{ inputs.integration }}"
    input:
      args: |
        Implement UI in {{ inputs.web_app }}:

        page.tsx (RSC):
        - async function Page() — no "use client"
        - await params and searchParams (Next 15+)
        - Fetch via the project's server-side caller, NOT client fetch
        - generateMetadata for SEO if public
        - <Suspense> boundaries around slow async sections

        Client components (use only at interactive leaves):
        - Mutations via the project's client query library
        - Query invalidation on success
        - Form library + schema resolver (schema from {{ inputs.shared_package }})
        - Server errors mapped to fields
        - Submit disabled while mutation is pending
        - Reset on create, prefill on edit
        - Optimistic updates with rollback where UX justifies

        Four states (mandatory):
        - loading: loading.tsx with skeleton matching final layout
        - empty: illustration + copy + primary CTA
        - error: error.tsx with humane message + retry (reset()) +
          error-tracker capture
        - success: toast / redirect / optimistic update

        Accessibility:
        - <label> linked to every input (no placeholder-only)
        - aria-invalid + aria-describedby on errors
        - :focus-visible respected
        - Keyboard navigation complete (Enter / Escape / Tab)
        - AA contrast
        - aria-live for async updates
        - alt on images, aria-hidden on decorative icons
        - 44×44px touch targets on mobile

        Styling:
        - Components from the project's UI library
        - No inline styles except dynamic values

        i18n: all strings via the project's i18n solution, ICU plurals,
        locale-aware formatters. No hardcoded language literals.

        Performance: next/image, next/font, next/dynamic for heavy
        client components, parallel fetches with Promise.all, no client
        re-fetch of RSC data.

  - id: ui-component-tests
    type: shell
    run: "{{ inputs.test_cmd }} {{ inputs.web_app }}/components/features/{{ inputs.feature_name }}"

  # ──────────────────────────────────────────────────────────────────
  # PHASE 10 — E2E tests (tenant isolation = blocking)
  # ──────────────────────────────────────────────────────────────────
  - id: e2e
    command: speckit.tasks
    integration: "{{ inputs.integration }}"
    input:
      args: |
        Implement E2E tests for "{{ inputs.feature_name }}" in the project's
        e2e directory:

        - happy.spec.ts: login → navigate → mutate → assert visible result
        - errors.spec.ts: validation error path + permission denied path

        - isolation.spec.ts (tagged @critical, MUST pass to merge):
          1. user A on page of tenant A → data visible
          2. user A on URL of tenant B → 404
          3. user A calls API with tenant B's key → 403
          4. user A on URL with resource id from tenant B → 404

        Setup: storage state per role, no re-login per test. Idempotent.
        No waitForTimeout — wait for selectors. Cleanup created data via
        afterEach if needed.

  - id: run-e2e
    type: shell
    run: "{{ inputs.e2e_cmd }} --grep {{ inputs.feature_name }}"

  - id: run-isolation-critical
    type: shell
    run: "{{ inputs.e2e_cmd }} --grep @critical --grep {{ inputs.feature_name }}"

  # ──────────────────────────────────────────────────────────────────
  # PHASE 11 — Quality gates
  # ──────────────────────────────────────────────────────────────────
  - id: quality-lint
    type: shell
    run: "{{ inputs.lint_cmd }}"

  - id: quality-typecheck
    type: shell
    run: "{{ inputs.typecheck_cmd }}"

  - id: quality-deadcode
    type: shell
    run: "{{ inputs.deadcode_cmd }}"

  - id: quality-build
    type: shell
    run: "{{ inputs.build_cmd }}"

  - id: quality-secretscan
    type: shell
    run: "{{ inputs.secretscan_cmd }}"

  - id: quality-dep-audit
    type: shell
    run: "{{ inputs.dep_audit_cmd }}"

  # ──────────────────────────────────────────────────────────────────
  # PHASE 12 — Verify (evidence-based) + PR preparation
  # ──────────────────────────────────────────────────────────────────
  - id: verify
    command: speckit.verify
    integration: "{{ inputs.integration }}"
    input:
      args: |
        Verify feature "{{ inputs.feature_name }}" end-to-end with evidence:
        every EARS acceptance criterion probed, flag key present in the
        registry, migration applied, observability signals actually emitted,
        rollback thresholds wired to alert rules, and every CI gate the
        tasks claim actually present in the repository's CI configuration.
        Also verify the Service Interaction Map against the diff: every
        "yes" row has call sites in the implementation, and any service the
        code touches that the map marked "no" (or omitted) is reported as
        MAP_DRIFT — undeclared interactions are failures, not notes.
        Write verify-report.md. FAIL blocks the ready-for-review gate.

  - id: self-review
    command: speckit.analyze
    integration: "{{ inputs.integration }}"
    input:
      args: |
        Cross-check the implementation against the RFC. Report drift:
        - Every RFC table implemented in the schema
        - Every RFC endpoint implemented
        - Every RFC permission rule enforced
        - Every cache tag in the RFC is invalidated by the right mutation
        - Validation schemas and DB types are consistent
        - No analytics-store imports in app code
        - No raw SQL anywhere
        - No `any` or `as` without a justifying comment
        - No relative cross-workspace imports
        - No console.log / debugger / unowned TODO
        - Feature flag still present and OFF

  - id: final-checklist
    command: speckit.checklist
    integration: "{{ inputs.integration }}"
    input:
      args: |
        Pre-merge checklist:
        - verify-report.md exists with overall PASS
        - Migration applied locally + rollback plan documented
        - Feature flag declared and OFF
        - @critical isolation tests green
        - Diff < 600 lines (split otherwise)
        - PR description complete
        - Conventional Commit title
        - Lockfile committed if deps changed
        - Secrets registered in the secret manager for new env vars
        - .env.example updated

  - id: pr-description
    type: prompt
    integration: "{{ inputs.integration }}"
    prompt: |
      Generate the PR description for "{{ inputs.feature_name }}":
      - Link to ticket + RFC PR + verify-report.md
      - Functional summary (what changes for users)
      - Technical summary (architecture choices, trade-offs, alternatives skipped)
      - Screenshot/Loom placeholders for all four UI states + mobile
      - Migration impact statement (forward-compatible?)
      - Rollback plan (flag OFF → behavior unchanged)
      - Client/SDK breaking changes if any (semver impact)
      - Conventional Commits title (feat / fix / refactor)

  - id: ready-for-review
    type: gate
    message: |
      Implementation complete, quality gates green, verify-report PASS.
      Push the branch and open the PR.
      Required approvers: 1 by default, 2 if billing / auth / security touched.
    options: [approve, reject]
    on_reject: abort
    check: "git grep -q 'ff-{{ inputs.feature_name }}' && find specs -type f -name 'verify-report.md' -path '*{{ inputs.feature_name }}*' | grep -q ."

  # ──────────────────────────────────────────────────────────────────
  # PHASE 13 — Rollout (post-merge)
  # ──────────────────────────────────────────────────────────────────
  - id: rollout
    type: switch
    expression: "{{ inputs.rollout_strategy }}"
    cases:

      internal-only:
        - id: deploy-staging-internal
          type: prompt
          integration: "{{ inputs.integration }}"
          prompt: >-
            Deploy the new build to staging via the project's deploy process
            (GitOps PR, platform deploy, etc.). Wait for the deploy to settle.

        - id: internal-flag-on
          type: gate
          message: >-
            Enable ff-{{ inputs.feature_name }} for the internal tenant only.
            Smoke test all four user paths. Verify traces/logs and absence of
            new errors in the error tracker.
          options: [done, abort]
          on_reject: abort

      progressive:
        - id: deploy-staging
          type: prompt
          integration: "{{ inputs.integration }}"
          prompt: >-
            Deploy the new build to staging via the project's deploy process.
            Confirm migrations run forward before the app serves traffic and
            secrets are synced.

        - id: staging-sync
          type: gate
          message: |
            Verify staging deploy:
            - App instances healthy, readiness green
            - Routing/TLS valid
            - DB, cache, and job-engine connections OK
            - No new errors in the error tracker
            - Startup logs clean
          options: [healthy, abort]
          on_reject: abort

        - id: internal-activation
          type: gate
          message: >-
            Flag ON for the internal tenant. Manual smoke test of all roles.
            Capture a metrics baseline.
          options: [pass, abort]
          on_reject: abort

        - id: beta-cohort
          type: gate
          message: |
            Activate 3–5 design partners. Observe 48–72h.
            Pass criteria:
            - error rate < threshold defined in Phase 0
            - p95 < threshold
            - marginal cost matches estimate
            - no critical UX confusion in feedback
          options: [pass, abort]
          on_reject: abort

        - id: prod-gate
          type: gate
          message: |
            Promotion to PRODUCTION requires manual confirmation.
            Type 'DEPLOY' to confirm. This is the last abort point.
          options: [DEPLOY, abort]
          on_reject: abort

        - id: deploy-prod
          type: prompt
          integration: "{{ inputs.integration }}"
          prompt: >-
            Deploy the new build to production via the project's deploy
            process. Wait for the deploy to settle.

        - id: rollout-10
          type: gate
          message: "Flag ON for 10% of tenants. Observe 24h. Verify dashboards."
          options: [pass, abort]
          on_reject: abort

        - id: rollout-50
          type: gate
          message: "Flag ON for 50% of tenants. Observe 24h."
          options: [pass, abort]
          on_reject: abort

        - id: rollout-100
          type: gate
          message: "Flag ON for 100% of tenants. Observe 48h."
          options: [pass, abort]
          on_reject: abort

      all-tenants:
        - id: direct-deploy-warning
          type: gate
          message: >-
            Direct 100% rollout selected. Only use for non-risky features
            (UI tweaks, copy changes). Type 'DEPLOY' to confirm.
          options: [DEPLOY, abort]
          on_reject: abort

  # ──────────────────────────────────────────────────────────────────
  # PHASE 14 — Observability provisioning
  # ──────────────────────────────────────────────────────────────────
  - id: dashboards
    type: prompt
    integration: "{{ inputs.integration }}"
    prompt: |
      Generate dashboard definitions for "{{ inputs.feature_name }}":
      - Volume: per day, segmented by plan + tenant
      - Latency p50/p95/p99 per endpoint
      - Error rate per endpoint and error type
      - Marginal cost (DB rows added, analytics rows, job executions)
      - Funnel if applicable (view → action → success)
      - J7 / J30 retention
      Commit them where the project's dashboards live (IaC/infra repo).

  - id: alerts
    type: prompt
    integration: "{{ inputs.integration }}"
    prompt: |
      Generate alert rules for "{{ inputs.feature_name }}" — one per rollback
      threshold in the spec, plus:
      - error_rate > threshold over 15min
      - p95 > threshold over 15min
      - new unique exception in the error tracker
      - background-job failure rate > threshold
      - dead-letter queue > 0
      - volume == 0 (silent breakage)
      Each alert links to a runbook. COMMIT and PROVISION them — an alert
      file that is authored but never deployed does not exist. Verify the
      rules are live before closing this step.

  - id: docs
    type: prompt
    integration: "{{ inputs.integration }}"
    prompt: |
      Publish documentation for "{{ inputs.feature_name }}":
      - User docs with up-to-date screenshots
      - Internal runbook (debug, rollback, kill switch), linked from the alerts
      - ADR if a significant technical choice was made
      - Update architecture diagram if new flow
      - Update the changelog

  # ──────────────────────────────────────────────────────────────────
  # PHASE 15 — Flag retirement & retro
  # ──────────────────────────────────────────────────────────────────
  - id: flag-removal
    type: gate
    message: |
      Wait 2 weeks of stable 100% rollout (zero incident).
      Then open a cleanup PR:
      - Remove the flag from code (pages, endpoints, components)
      - Remove the flag entry from the registry
      - Adapt tests (no more dual path)
      Choose 'abort' to stop here and resume the workflow later.
    options: [stable, abort]
    on_reject: abort

  - id: cleanup-pr
    type: prompt
    integration: "{{ inputs.integration }}"
    prompt: >-
      Generate the cleanup PR description. Title format:
      "chore({{ inputs.feature_name }}): remove feature flag after stable rollout".

  - id: retro
    type: prompt
    integration: "{{ inputs.integration }}"
    prompt: |
      Run a short retro for "{{ inputs.feature_name }}":
      - What went well
      - What slipped between RFC and production (compare verify-report.md
        follow-ups against what actually got fixed)
      - Estimation vs actual (T-shirt size accuracy)
      - Patterns to extract into the feature template
      Close the ticket with links: RFC PR, code PR, cleanup PR, dashboards,
      alerts. Compare Phase 0 success metrics to observed reality.
