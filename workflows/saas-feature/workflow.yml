schema_version: "1.0"

workflow:
  id: "saas-feature"
  name: "SaaS Feature Delivery Cycle (Delta-Global)"
  version: "2.0.0"
  author: "satcom"
  description: >-
    Feature delivery for the Delta-Global platform, end to end: optional
    research → spec + clarify → plan (GraphQL, owner-scoped, global flag,
    Service Interaction Map) → tasks by user story → implementation in
    checkpointed phases (tests first, one commit per phase) → the real CI
    gate battery → evidence-based verify → observability as code in
    platform-infra → release(<app>) → staging pin → flag ON on staging →
    production pin + manual ArgoCD sync → flag ON in production → flag
    retirement and retro. Requires the delta-global preset (see
    presets/delta-global/CONVENTIONS.md for every rule it encodes).

requires:
  speckit_version: ">=0.7.2"
  integrations:
    any: ["claude", "copilot", "gemini"]

inputs:
  feature_name:
    type: string
    required: true
    prompt: "Feature slug (kebab-case) — also the flag key, e.g. 'sector-source-overrides'"

  feature_description:
    type: string
    required: true
    prompt: "What the feature does for the user, in one or two sentences"

  research_brief:
    type: string
    default: "none"
    prompt: "Path to a /speckit.research brief (docs/research/<date>-<slug>/brief.md), or 'none'"

  needs_research:
    type: boolean
    default: false
    prompt: "No brief yet — run /speckit.research first (prior art, 2026 state of the art, options)?"

  integration:
    type: string
    default: "auto"
    prompt: "AI coding integration to use (auto, claude, copilot, gemini)"

  uses_flag:
    type: boolean
    default: true
    prompt: "Ship behind a DB-backed capability flag named after the slug? (no only for trivial, risk-free changes)"

  needs_migration:
    type: boolean
    default: true
    prompt: "Does the feature change the Drizzle schema?"

  needs_temporal:
    type: boolean
    default: false
    prompt: "Does it add or change a Temporal workflow / activity?"

  touches_workers:
    type: boolean
    default: false
    prompt: "Does it change apps/workers (Python)?"

  needs_adr:
    type: boolean
    default: false
    prompt: "Known ADR trigger? (new external service, new API surface, new store, pinned version/convention change)"

  touches_sensitive:
    type: boolean
    default: false
    prompt: "Does it touch auth, billing/Stripe, the admin realm, or personal data? (stricter review + threat pass)"

  rollout_strategy:
    type: string
    default: "flag-staged"
    enum: ["flag-staged", "dark-launch", "no-flag"]
    prompt: >-
      flag-staged (ship OFF → ON in staging → ON in production),
      dark-launch (ship OFF everywhere, enable later),
      no-flag (behaviour live on deploy)

  release_apps:
    type: string
    default: "api web"
    prompt: "Apps to release, space-separated, api first when a migration ships (api web crawler workers)"

  infra_repo:
    type: string
    default: "../platform-infra"
    prompt: "Path to the platform-infra checkout"

  diff_coverage_min:
    type: number
    default: 70
    prompt: "Minimum changed-line coverage (%) — the CI gate due 2026-10-24"

  lint_cmd:
    type: string
    default: "bunx biome ci ."
    prompt: "Lint command"

  typecheck_cmd:
    type: string
    default: "bun run typecheck"
    prompt: "Typecheck command (also runs check:field-auth, field-audit, log-hygiene, contrast)"

  test_cmd:
    type: string
    default: "bun test"
    prompt: "Test runner for targeted runs (path appended; set INTEGRATION_DB_URL for integration suites)"

  full_test_cmd:
    type: string
    default: "bun run test"
    prompt: "Full test command"

  build_cmd:
    type: string
    default: "bun run build"
    prompt: "Build command"

steps:
  # ──────────────────────────────────────────────────────────────────
  # PHASE 0 — Research (optional)
  # ──────────────────────────────────────────────────────────────────
  - id: research
    type: if
    condition: "{{ inputs.needs_research == true and inputs.research_brief == 'none' }}"
    then:
      - id: research-brief
        command: speckit.research
        integration: "{{ inputs.integration }}"
        input:
          args: |
            {{ inputs.feature_description }}

            Slug: {{ inputs.feature_name }}. Standard depth. Ground in the
            platform first (constitution, CLAUDE.md, ADRs, PRODUCT.md, shipped
            specs, code), then research prior art, the current state of the
            art, stack-compatible approaches, failure modes, compliance and
            cost. Write docs/research/<today>-{{ inputs.feature_name }}/brief.md.

      - id: review-research
        type: gate
        message: |
          Read the research brief before anything is specified.
          - Is the idea already built, deferred or rejected? (then stop)
          - Is the recommended approach compliant, or does it need an ADR?
          - Is the MVP slice the right one?
        options: [approve, reject]
        on_reject: abort
        check: "find docs/research -path '*{{ inputs.feature_name }}*' -name brief.md | grep -q ."

  # ──────────────────────────────────────────────────────────────────
  # PHASE 1 — Specify + clarify
  # ──────────────────────────────────────────────────────────────────
  - id: specify
    command: speckit.specify
    integration: "{{ inputs.integration }}"
    input:
      args: |
        Feature: {{ inputs.feature_name }}
        Description: {{ inputs.feature_description }}
        Research brief: {{ inputs.research_brief }} — if 'none' but one was
        produced in this run, use docs/research/*-{{ inputs.feature_name }}*/brief.md.
        Carry its recommendation, seed ACs, non-goals and open questions.

        Run the intake interview with the user first (skip if no user is present).
        Use the delta-global spec template. In particular:
        - Context section with file:line references to what exists today
        - Stories P1 (MVP) … with real roles (no "viewer"), AC-### numbered
          globally, binary, EARS or Given/When/Then — including the failure
          cases (not the owner, flag OFF, dependency down)
        - Tenancy model declared (owner-scoped by default)
        - Kill-switch strategy, Manual Verification table, Performance budget
        - Success metrics, rollback thresholds, marginal cost from measured
          volumes, plan & entitlement impact, GDPR classification
        - Flag: {{ inputs.feature_name }} (no ff- prefix) unless uses_flag is
          false ({{ inputs.uses_flag }})

  - id: clarify
    command: speckit.clarify
    integration: "{{ inputs.integration }}"
    input:
      args: >-
        Resolve every [NEEDS CLARIFICATION] that changes the data model, the
        GraphQL surface, authorization, tenancy, entitlements or the
        kill-switch. Record answers under Clarifications with today's date.

  - id: scope-checklist
    command: speckit.checklist
    integration: "{{ inputs.integration }}"
    input:
      args: "preset:scope"

  - id: review-scope
    type: gate
    message: |
      Review the spec before design.
      - Every AC binary and testable; failure cases present
      - MVP story is genuinely shippable alone
      - Rollback thresholds and success metrics measurable
      - No open NEEDS CLARIFICATION (machine-checked)
    options: [approve, reject]
    on_reject: abort
    check: "f=$(find specs -path '*-{{ inputs.feature_name }}/spec.md' | head -1); [ -n \"$f\" ] && ! grep -q 'NEEDS CLARIFICATION' \"$f\""

  # ──────────────────────────────────────────────────────────────────
  # PHASE 2 — Plan (design record)
  # ──────────────────────────────────────────────────────────────────
  - id: plan
    command: speckit.plan
    integration: "{{ inputs.integration }}"
    input:
      args: |
        Plan "{{ inputs.feature_name }}" on the delta-global plan template.
        Migration expected: {{ inputs.needs_migration }} · Temporal:
        {{ inputs.needs_temporal }} · Python workers: {{ inputs.touches_workers }}
        · Sensitive (auth/billing/admin/PII): {{ inputs.touches_sensitive }}.
        Read the code you will extend before designing; measure, don't assume.
        Write research.md, data-model.md, contracts/schema.graphql,
        quickstart.md and plan.md (Service Interaction Map + §1–§14).

  - id: threat-pass
    type: if
    condition: "{{ inputs.touches_sensitive == true }}"
    then:
      - id: threat-model
        type: prompt
        integration: "{{ inputs.integration }}"
        prompt: |
          Run a lightweight STRIDE pass on plan.md for "{{ inputs.feature_name }}"
          and append it to research.md as an R-entry: spoofing (JWT, session
          leaks across accounts in one tab), tampering (scope key from input,
          Stripe events applied as state), repudiation (@audited coverage,
          reason top-level), information disclosure (raw error text, PII in
          logs/spans/labels, @public misread as anonymous), DoS (@cost,
          rate limits, unbounded lists, LLM spend), elevation (admin re-check
          per call, admin DAL isolation). Map each mitigation to a plan
          section and a test in §11; add missing ones to the plan.

  - id: plan-analyze
    command: speckit.analyze
    integration: "{{ inputs.integration }}"
    input:
      args: >-
        Spec ↔ plan: every FR and AC covered; every SDL field has a directive
        and an RBAC row; every cache key an invalidation site; every
        rollback threshold an alert row; the Service Interaction Map
        consistent with §1–§13; no forbidden pattern; migrations expand-only
        or justified.

  - id: rfc-checklist
    command: speckit.checklist
    integration: "{{ inputs.integration }}"
    input:
      args: "preset:rfc"

  - id: adr
    type: if
    condition: "{{ inputs.needs_adr == true }}"
    then:
      - id: adr-draft
        type: prompt
        integration: "{{ inputs.integration }}"
        prompt: |
          Draft the ADR the plan requires in docs/adr/NNNN-<title>.md
          (next free number — 0031 is unused but do not reuse gaps silently;
          check the list). Nygard/MADR shape as the existing ADRs: context,
          decision, consequences, alternatives, and for a new external
          service the egress (CLAUDE.md Approved External Services row +
          platform-infra charts/network-policies entry with `adr:`).
          Status: Proposed.

      - id: review-adr
        type: gate
        message: |
          The ADR must be Accepted before implementation starts
          (spec 024 ran ahead of its approval — don't repeat it).
        options: [approve, reject]
        on_reject: abort

  - id: review-plan
    type: gate
    message: |
      Review the design record (plan.md + research.md + contracts).
      - Tenancy model declared; scope predicate on every query
      - Every field annotated; admin mutations @audited with top-level reason
      - Migration recipe safe while the previous release serves
      - Flag OFF restores today's behaviour exactly
      - §14 lists every deviation (e.g. --custom RLS block)
      Extra reviewer if auth/billing/admin/PII is touched ({{ inputs.touches_sensitive }}).
    options: [approve, reject]
    on_reject: abort
    check: "f=$(find specs -path '*-{{ inputs.feature_name }}/plan.md' | head -1); [ -n \"$f\" ] && grep -q 'Service Interaction Map' \"$f\" && grep -q 'Complexity Justification' \"$f\""

  # ──────────────────────────────────────────────────────────────────
  # PHASE 3 — Tasks
  # ──────────────────────────────────────────────────────────────────
  - id: tasks
    command: speckit.tasks
    integration: "{{ inputs.integration }}"
    input:
      args: >-
        Generate tasks.md for "{{ inputs.feature_name }}": by user story,
        tests first, exact verified paths, AC mapping, @critical authz test per
        mutation, gate battery and verify in Polish.

  - id: tasks-analyze
    command: speckit.analyze
    integration: "{{ inputs.integration }}"
    input:
      args: "Full spec ↔ plan ↔ tasks analysis. Every AC-### must map to a task; report CRITICAL/HIGH findings."

  - id: review-tasks
    type: gate
    message: |
      Approve the task list. CRITICAL/HIGH analyze findings must be resolved
      or turned into tasks — never shipped in an "open findings" table.
    options: [approve, reject]
    on_reject: abort
    check: "f=$(find specs -path '*-{{ inputs.feature_name }}/tasks.md' | head -1); [ -n \"$f\" ] && grep -Eq '^- \\[ \\] T[0-9]{3}' \"$f\" && ! grep -q 'TASK-0' \"$f\""

  # ──────────────────────────────────────────────────────────────────
  # PHASE 4 — Implementation, checkpointed (tests first, one commit per phase)
  # ──────────────────────────────────────────────────────────────────
  - id: branch-guard
    type: shell
    run: "b=$(git rev-parse --abbrev-ref HEAD); case \"$b\" in main|staging|production) echo \"on $b — work on the feature branch\"; exit 1;; esac"

  - id: implement-foundation
    command: speckit.implement
    integration: "{{ inputs.integration }}"
    input:
      args: |
        Implement ONLY Phase 1 (Setup) and Phase 2 (Foundational) of tasks.md.
        Tests first: write them, run them, see them fail, implement, see them
        pass. Register the flag OFF if uses_flag ({{ inputs.uses_flag }}).
        Generate migrations with `bun run db:generate` — never hand-written
        except the justified --custom RLS block. Do NOT apply migrations to the
        shared dev database. One Conventional Commit per phase; never push
        to main/staging/production. Tick only tasks whose command you ran.

  - id: migration
    type: if
    condition: "{{ inputs.needs_migration == true }}"
    then:
      - id: migration-checks
        type: shell
        run: "bun run check:migration-immutability origin/main && bun run check:migration-expand-contract origin/main"

      - id: review-migration
        type: gate
        message: |
          Read the generated SQL in packages/db/drizzle/ line by line.
          It runs in the api db-migrate init container, in ONE transaction,
          while the previous release still serves. Expand only:
          - no DROP / RENAME / ALTER TYPE / SET NOT NULL on what the running release uses
          - ADD COLUMN NOT NULL only with a constant DEFAULT
          - index on a large existing table: built CONCURRENTLY by hand in staging/prod first
          - new table has its --custom RLS block (justified in plan §14)
          - any Allow-Contract-Migration trailer names what is removed and since which release
          No backups exist: data-rewriting changes need a pg_dumpall before staging/prod.
        options: [approve, reject]
        on_reject: abort

  - id: checkpoint-foundation
    type: gate
    message: |
      Foundation done? Phase 1–2 tasks ticked with evidence, tests green,
      one commit per phase. Approve to implement the MVP story (US1).
    options: [approve, reject]
    on_reject: abort
    check: "{{ inputs.typecheck_cmd }}"

  - id: implement-mvp
    command: speckit.implement
    integration: "{{ inputs.integration }}"
    input:
      args: |
        Implement ONLY the US1 (MVP) phase of tasks.md: tests first (including
        the @critical authz/isolation test for every mutation and the flag-OFF
        test), then implementation, then the checkpoint commit. Keep resolvers
        thin over services; DB functions in packages/db; RSC reads through
        lib/server/*; imperative calls through the surface seam; i18n keys in
        en/fr/es; four UI states with DOM tests (installDom()).

  - id: run-feature-tests
    type: shell
    timeout: 1200
    run: "{{ inputs.test_cmd }} apps/api/test/{{ inputs.feature_name }}"

  - id: checkpoint-mvp
    type: gate
    message: |
      MVP checkpoint. US1's ACs pass in tests (above). Run quickstart.md
      locally with the flag ON and click through US1's Manual Verification
      rows now — cheaper than after five more stories. Approve to implement
      the remaining stories.
    options: [approve, reject]
    on_reject: abort

  - id: implement-rest
    command: speckit.implement
    integration: "{{ inputs.integration }}"
    input:
      args: |
        Implement the remaining phases of tasks.md in order (US2…, background
        work, Polish except the infra and release tasks), one phase at a
        time: tests first, see them fail, implement, see them pass, one
        commit per phase. Stop and report if a phase's ACs do not pass —
        do not start the next one.

  - id: temporal
    type: if
    condition: "{{ inputs.needs_temporal == true }}"
    then:
      - id: temporal-replay
        type: shell
        timeout: 900
        run: "bun test packages/temporal-workflows/test/"

  # ──────────────────────────────────────────────────────────────────
  # PHASE 5 — Gate battery (what CI runs — CONVENTIONS §8)
  # ──────────────────────────────────────────────────────────────────
  - id: gate-lint
    type: shell
    run: "{{ inputs.lint_cmd }}"

  - id: gate-structure
    type: shell
    timeout: 600
    run: "bun run depcruise && bun run check:composition-root && bun run check:trpc-removal && bash scripts/guard-admin-dal-isolation.sh"

  - id: gate-typecheck
    type: shell
    timeout: 1200
    run: "{{ inputs.typecheck_cmd }}"

  - id: gate-generated
    type: shell
    timeout: 600
    run: "bun --filter='@delta-global/web' codegen:check && bun run check:py-models && bun run check:svg-assets"

  - id: gate-i18n
    type: shell
    run: "bun run scripts/i18n-parity.ts && bun run scripts/i18n-scan.ts"

  - id: gate-migrations
    type: if
    condition: "{{ inputs.needs_migration == true }}"
    then:
      - id: gate-migration-rules
        type: shell
        run: "bun run check:migration-immutability origin/main && bun run check:migration-expand-contract origin/main && bun test scripts/check-migration-expand-contract.test.ts"

  - id: gate-tests
    type: shell
    timeout: 2400
    run: "{{ inputs.full_test_cmd }} && bun run check:integration-skip"

  - id: gate-python
    type: if
    condition: "{{ inputs.touches_workers == true }}"
    then:
      - id: gate-workers
        type: shell
        timeout: 1800
        run: "cd apps/workers && uv run ruff check && uv run ruff format --check && uv run ty check && uv run pytest tests/ -rs"

  - id: gate-bundle
    type: shell
    timeout: 1800
    run: "bun run turbo run build --filter=@delta-global/web && bun --filter=@delta-global/web perf:budget"

  - id: gate-build
    type: shell
    timeout: 1800
    run: "{{ inputs.build_cmd }}"

  - id: gate-secrets
    type: shell
    run: "gitleaks detect --source . --redact --no-banner --log-opts=origin/main..HEAD"

  - id: gate-deps
    type: shell
    run: "bun audit --audit-level=high"

  - id: gate-coverage
    type: gate
    message: |
      Changed-line coverage must be ≥ {{ inputs.diff_coverage_min }}%
      (diff-cover over lcov; the CI gate is due 2026-10-24 — check whether
      ci.yml enforces it yet). A warning here is a decision, not a pass.
    options: [approve, reject]
    on_reject: abort
    check: "bun run test:affected --coverage --coverage-reporter=lcov >/dev/null 2>&1; uvx --from 'diff-cover==10.6.0' diff-cover coverage/lcov.info --compare-branch=origin/main --fail-under={{ inputs.diff_coverage_min }}"
    on_check_fail: warn

  # ──────────────────────────────────────────────────────────────────
  # PHASE 6 — Verify (evidence) + PR
  # ──────────────────────────────────────────────────────────────────
  - id: flag-registered
    type: if
    condition: "{{ inputs.uses_flag == true }}"
    then:
      - id: flag-registry-check
        type: shell
        run: "grep -Eq \"[\\\"']{{ inputs.feature_name }}[\\\"']\" packages/shared/src/schemas/feature-flags.ts && grep -Eq \"{{ inputs.feature_name }}\" packages/db/src/seeds/feature-flags.ts"

  - id: verify
    command: speckit.verify
    integration: "{{ inputs.integration }}"
    input:
      args: |
        Verify "{{ inputs.feature_name }}" with evidence, per CONVENTIONS:
        - every AC-### probed (GraphQL request with a real JWT, targeted test
          run, or browser) — PASS / FAIL / UNVERIFIABLE, never from code reading
        - IF-cases actually triggered: another user's id, a non-admin calling
          an @auth(ADMIN) field, flag OFF, Redis down where the plan claims
          degradation
        - flag in FEATURE_FLAG_KEYS + METADATA + seed (+ python mirror if read
          there), default OFF, guards present
        - every new field annotated; every admin mutation writes one audit_log row
        - migration generated, expand-only, applied to a disposable DB
        - Service Interaction Map vs the diff in both directions (MAP_DRIFT is FAIL)
        - each claimed gate exists in .github/workflows/ci.yml (GATE_MISSING_FROM_CI)
        - each rollback threshold has an alert rule planned in platform-infra
          (THRESHOLD_UNWIRED until the infra PR exists)
        - Manual Verification rows: list which a person has done, which not
        Write verify-report.md. Update the spec's Status/Verified header to
        say what automation verified vs what a person verified.

  - id: impl-analyze
    command: speckit.analyze
    integration: "{{ inputs.integration }}"
    input:
      args: "Implementation ↔ plan drift: directives, scope predicates, cache invalidation, flag guards, forbidden patterns, stale paths."

  - id: premerge-checklist
    command: speckit.checklist
    integration: "{{ inputs.integration }}"
    input:
      args: "preset:pre-merge"

  - id: pr-description
    type: prompt
    integration: "{{ inputs.integration }}"
    prompt: |
      Write the PR description for "{{ inputs.feature_name }}" (squash-merge;
      Conventional Commit title with a commitlint scope, PR number appended
      on merge). Body: what changes for users · design summary linking
      spec/plan/research/ADR · migration (expand-only? recipe? trailer?) ·
      flag (key, OFF at merge) · env vars and Infisical keys per env · egress
      (or none) · rollback plan (flag OFF, then pin back with
      `ship.py promote --to`) · verify-report summary incl. UNVERIFIABLE
      items · Manual Verification still owed · screenshots of the four UI
      states + mobile.

  - id: ready-for-review
    type: gate
    message: |
      Gates green, verify-report PASS, PR description ready. Push the branch
      and open the PR. GitHub Free has no required checks — confirm CI is
      actually green on the PR before merging.
    options: [approve, reject]
    on_reject: abort
    check: "f=$(find specs -path '*-{{ inputs.feature_name }}/verify-report.md' | head -1); [ -n \"$f\" ] && grep -Eq 'Overall\\*\\*: *PASS' \"$f\""

  # ──────────────────────────────────────────────────────────────────
  # PHASE 7 — Observability, secrets & egress as code (platform-infra)
  # ──────────────────────────────────────────────────────────────────
  - id: infra-as-code
    type: prompt
    integration: "{{ inputs.integration }}"
    prompt: |
      In {{ inputs.infra_repo }} (separate repo, its own branch and PR —
      GitOps only, never kubectl apply), for "{{ inputs.feature_name }}":
      1. Alert rules charts/grafana/alerting/<NNN>-{{ inputs.feature_name }}.json
         — one per spec rollback threshold, plus volume == 0 (silent breakage)
         and, if Temporal, workflow failure rate. ClickHouse datasource uid
         clickhouse-otel, scoped to deployment.environment='production',
         labels severity (page|ticket|info) + service, annotation runbook_url
         → the platform runbook. No Go templating (double braces, $labels,
         $values) anywhere in annotations/labels (Discord, ADR-0030).
      2. Dashboard charts/grafana/dashboards/<NNN>-{{ inputs.feature_name }}.json
         (unique filename): volume, p50/p95/p99 per operation, error rate by
         code, cost signals, funnel if any.
      3. New secrets: list the keys to add at Infisical /app-stack for dev,
         staging and production (values are set by a human, never committed);
         no chart default for an Infisical-owned key.
      4. New egress: charts/network-policies/values.yaml entry with its ADR.
      5. Run the repo's gates: scripts/check-alert-annotations.sh,
         scripts/check-slo-windows.sh, scripts/check-charts.sh,
         scripts/check-rendered.sh.
      In the platform repo, write docs/runbooks/{{ inputs.feature_name }}.md:
      symptoms per alert, kill switch (setFeatureFlag with reason), rollback
      pin, known failure modes.

  - id: infra-gates
    type: shell
    timeout: 900
    run: "cd {{ inputs.infra_repo }} && bash scripts/check-alert-annotations.sh && bash scripts/check-slo-windows.sh"

  - id: review-infra
    type: gate
    message: |
      platform-infra PR open with alert rules + dashboard (+ egress), the
      runbook exists, Infisical keys set for every env by a human.
      Alerts must be merged AND live before the flag goes ON in production:
      after ArgoCD syncs, `kubectl -n observability rollout restart deploy/grafana`
      (the sidecar does not reload alert rules on its own).
    options: [approve, reject]
    on_reject: abort
    check: "ls {{ inputs.infra_repo }}/charts/grafana/alerting/ | grep -q '{{ inputs.feature_name }}' && test -f docs/runbooks/{{ inputs.feature_name }}.md"

  # ──────────────────────────────────────────────────────────────────
  # PHASE 8 — Release & rollout (after merge)
  # ──────────────────────────────────────────────────────────────────
  - id: merged
    type: gate
    message: |
      Squash-merge the PR once CI is green. Merge is not deploy: nothing
      runs anywhere until a release() commit builds images and an
      environment pins them.
    options: [merged, abort]
    on_reject: abort

  - id: ship-plan
    type: shell
    timeout: 600
    run: "git fetch origin main --tags && uv run scripts/ship.py plan"

  - id: release-authorize
    type: gate
    message: |
      Release {{ inputs.release_apps }}. This pushes one empty
      `release(<app>): <subject>` commit per app to main (lowercase subject;
      api first when a migration ships — its db-migrate init container
      applies it). Authorize the pushes.
    options: [approve, abort]
    on_reject: abort

  - id: release
    type: prompt
    integration: "{{ inputs.integration }}"
    prompt: |
      Follow the shipping-a-release skill: `scripts/release.sh --dry-run
      {{ inputs.release_apps }}`, then the real run, and watch each Release
      workflow (ci-release-gate.sh must find a green CI push run). Report the
      versions built (<app>-v<semver>). Dev is auto-pinned but runs no app
      pods — staging is the first real environment.

  - id: staging-pin
    type: prompt
    integration: "{{ inputs.integration }}"
    prompt: |
      `uv run scripts/ship.py promote --env staging {{ inputs.release_apps }}`
      → commit `chore(deploy): pin staging to <app> <ver>` in
      {{ inputs.infra_repo }} charts/app-stack/values-staging.yaml (auto-sync).
      Then check the db-migrate init container logs and build_info from inside
      the pods.

  - id: staging-verify
    type: shell
    timeout: 900
    run: "uv run scripts/ship.py verify --env staging"

  - id: rollout
    type: switch
    expression: "{{ inputs.rollout_strategy }}"
    cases:
      flag-staged:
        - id: staging-flag-on
          type: gate
          message: |
            Turn `{{ inputs.feature_name }}` ON in staging (admin console →
            setFeatureFlag, reason required, audited). Then verify THE
            FEATURE, not the pods: every Manual Verification row, the
            flag-OFF path once more, no new GlitchTip issues, no new error
            logs in Grafana for the operations it touches.
          options: [pass, abort]
          on_reject: abort

        - id: prod-gate
          type: gate
          message: |
            Promote to PRODUCTION exactly the versions verified on staging.
            Flag stays OFF. Type DEPLOY to confirm — last abort point.
          options: [DEPLOY, abort]
          on_reject: abort

        - id: prod-pin
          type: prompt
          integration: "{{ inputs.integration }}"
          prompt: |
            `uv run scripts/ship.py promote --env production {{ inputs.release_apps }}`
            → commit the pin in values-production.yaml → `argocd app diff
            app-stack-production` → show the diff to the user →
            `argocd app sync app-stack-production` (production has no auto-sync).

        - id: prod-verify
          type: shell
          timeout: 900
          run: "uv run scripts/ship.py verify --env production"

        - id: prod-flag-on
          type: gate
          message: |
            Alert rules for the rollback thresholds are live in Grafana
            (merged, synced, grafana restarted)? Then turn
            `{{ inputs.feature_name }}` ON in production with a reason.
            Watch the dashboard for the first hour; rollback = flag OFF.
          options: [pass, abort]
          on_reject: abort

        - id: observe
          type: gate
          message: |
            72 h after ON: error rate and p95 under the spec thresholds,
            marginal cost matches the estimate, no new GlitchTip issue,
            success metrics trending. Record the numbers in the spec
            (Status/Verified, dated).
          options: [stable, abort]
          on_reject: abort

      dark-launch:
        - id: prod-gate-dark
          type: gate
          message: |
            Promote to PRODUCTION with the flag OFF everywhere. Type DEPLOY.
          options: [DEPLOY, abort]
          on_reject: abort

        - id: prod-pin-dark
          type: prompt
          integration: "{{ inputs.integration }}"
          prompt: |
            `uv run scripts/ship.py promote --env production {{ inputs.release_apps }}`,
            commit the pin, `argocd app diff` / `argocd app sync app-stack-production`,
            then `uv run scripts/ship.py verify --env production`. The flag
            stays OFF; record in the spec when and by whom it will be enabled.

      no-flag:
        - id: staging-check-noflag
          type: gate
          message: "Verify the change on staging (Manual Verification rows, logs, GlitchTip)."
          options: [pass, abort]
          on_reject: abort

        - id: prod-gate-noflag
          type: gate
          message: |
            No kill switch: rollback is a pin back (`ship.py promote --to`).
            Type DEPLOY to promote to production.
          options: [DEPLOY, abort]
          on_reject: abort

        - id: prod-pin-noflag
          type: prompt
          integration: "{{ inputs.integration }}"
          prompt: |
            `uv run scripts/ship.py promote --env production {{ inputs.release_apps }}`,
            commit the pin, `argocd app diff` / `argocd app sync app-stack-production`,
            then `uv run scripts/ship.py verify --env production`, then watch
            the dashboard for an hour.

  # ──────────────────────────────────────────────────────────────────
  # PHASE 9 — Carry-forward, flag retirement, retro
  # ──────────────────────────────────────────────────────────────────
  - id: carry-forward
    type: prompt
    integration: "{{ inputs.integration }}"
    prompt: |
      Close the loop for "{{ inputs.feature_name }}":
      - spec.md header: Status (shipped where, which versions) and Verified
        (automation vs person, dated)
      - CLAUDE.md SPECKIT START/END block: what a future session must carry —
        measured facts, invariants guarded by tests, what is NOT done
      - docs/documentation/features/ page if user-facing
      - follow-ups.md in the spec dir: every FAIL/UNVERIFIABLE from
        verify-report and every deferred item, each with an owner
      Do not claim anything landed that you did not check.

  - id: flag-removal
    type: if
    condition: "{{ inputs.uses_flag == true }}"
    then:
      - id: flag-stable
        type: gate
        message: |
          After ≥ 2 weeks ON in production with no incident, retire the flag:
          remove it from FEATURE_FLAG_KEYS + METADATA, the python mirror, the
          seed, every guard (api wrapper, serverFeatureFlag, useFeatureFlag),
          and the flag-OFF tests. Choose 'abort' to stop here and come back later.
        options: [stable, abort]
        on_reject: abort

      - id: cleanup-pr
        type: prompt
        integration: "{{ inputs.integration }}"
        prompt: >-
          Implement the flag removal on a branch `chore/remove-{{ inputs.feature_name }}-flag-<id>`
          and write the PR: "chore: remove {{ inputs.feature_name }} flag after stable rollout".

  - id: retro
    type: prompt
    integration: "{{ inputs.integration }}"
    prompt: |
      Write specs/<NNN>-{{ inputs.feature_name }}/retro.md:
      - what went well; what slipped between plan and production (verify
        report vs reality)
      - estimate vs actual per phase
      - spec success metrics vs observed (with dates and queries)
      - anything the kit should learn: a template section that was wrong, a
        check that would have caught a bug → propose the change to
        presets/delta-global/CONVENTIONS.md or a command
